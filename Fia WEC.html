<section class="countdown-container" style="background-color: #1c2541; padding: 30px; border-radius: 12px; max-width: 500px; width: 100%; text-align: center; border-top: 5px solid #e10600; font-family: 'Segoe UI', sans-serif; margin: 0 auto 20px auto;">

    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">
        FINAL: 13 DE JUNHO DE 2026
    </p>
    
    <!-- ÁREA DO CRONÔMETRO -->
    <div id="timer" style="display: flex; justify-content: space-between; gap: 10px;">
        <div style="flex: 1; background-color: #0a1128; padding: 12px 5px; border-radius: 8px; border: 1px solid #334155;">
            <span id="days" style="display: block; font-size: 1.8rem; font-weight: 800; color: #00b4d8;">00</span>
            <p style="font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin: 0; letter-spacing: 1px;">Dias</p>
        </div>
        <div style="flex: 1; background-color: #0a1128; padding: 12px 5px; border-radius: 8px; border: 1px solid #334155;">
            <span id="hours" style="display: block; font-size: 1.8rem; font-weight: 800; color: #00b4d8;">00</span>
            <p style="font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin: 0; letter-spacing: 1px;">Horas</p>
        </div>
        <div style="flex: 1; background-color: #0a1128; padding: 12px 5px; border-radius: 8px; border: 1px solid #334155;">
            <span id="minutes" style="display: block; font-size: 1.8rem; font-weight: 800; color: #00b4d8;">00</span>
            <p style="font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin: 0; letter-spacing: 1px;">Min.</p>
        </div>
        <div style="flex: 1; background-color: #0a1128; padding: 12px 5px; border-radius: 8px; border: 1px solid #e10600;">
            <span id="seconds" style="display: block; font-size: 1.8rem; font-weight: 800; color: #00b4d8;">00</span>
            <p style="font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin: 0; letter-spacing: 1px;">Seg.</p>
        </div>
    </div>
</section>
<script>
    // Define o alvo de forma segura para o dia 13 de Junho de 2026
    const targetDate = new Date(2026, 5, 13, 11, 0, 0).getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        const timerElement = document.getElementById('timer');

        // Se a data chegar ou passar, exibe a mensagem de início
        if (difference <= 0) {
            clearInterval(countdownInterval);
            timerElement.innerHTML = "<h3 style='color: #00b4d8; width:100%; text-align:center; font-weight:800; font-size:1.6rem;'>A CORRIDA COMEÇOU!</h3>";
            return;
        }

        // Cálculos do tempo restante
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        // Atualiza os textos internos de forma segura na tela
        document.getElementById('days').innerText = String(days).padStart(2, '0');
        document.getElementById('hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
        document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    // Inicializa imediatamente
    updateCountdown();

    // Roda a verificação de segundo em segundo
    const countdownInterval = setInterval(updateCountdown, 1000);
</script>

<script>
    function updateTimer() {
        // Alvo: 19 de Abril de 2026
        const raceDate = new Date("April 19, 2026 08:00:00").getTime();
        const now = new Date().getTime();
        const diff = raceDate - now;

        if (diff <= 0) {
            document.getElementById("timer").innerHTML = "<h2 style='color:white'>A CORRIDA COMEÇOU!</h2>";
            return;
        }

        const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30.44));
        const days = Math.floor((diff % (1000 * 60 * 60 * 24 * 30.44)) / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById("months").innerText = String(months).padStart(2, '0');
        document.getElementById("days").innerText = String(days).padStart(2, '0');
        document.getElementById("hours").innerText = String(hours).padStart(2, '0');
        document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
        document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }

    setInterval(updateTimer, 1000);
    updateTimer();
</script>
