<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha Lucas Law</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; background-color: #1a1a1a; border: 1px solid #2d2d2d; padding: 20px; border-radius: 6px; }
.main-header { background-color: #e10600; color: white; padding: 15px; font-weight: bold; font-size: 22px; border-radius: 4px; text-align: center; margin-bottom: 25px; letter-spacing: 1px; }

/* Status da Conexão */
.telemetry-status { display: flex; align-items: center; justify-content: space-between; background-color: #222; border: 1px solid #333; padding: 10px 15px; border-radius: 4px; margin-bottom: 20px; font-size: 13px; }
.status-indicator { display: flex; align-items: center; gap: 8px; font-weight: bold; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot.online { background-color: #00e676; box-shadow: 0 0 8px #00e676; }
.dot.offline { background-color: #ff1744; box-shadow: 0 0 8px #ff1744; }

.section-title { font-size: 18px; color: #fff; background-color: #262626; padding: 8px 12px; border-left: 4px solid #00a8ff; margin-top: 30px; margin-bottom: 15px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; margin-bottom: 25px; }
th { background-color: #222; color: #999; padding: 10px; font-weight: 600; border-bottom: 2px solid #333; text-transform: uppercase; font-size: 11px; }
td { padding: 10px; border-bottom: 1px solid #262626; vertical-align: middle; }
tr:hover { background-color: #222; }
.pos { font-weight: bold; color: #ffbc00; text-align: center; width: 35px; }
.driver-name { font-weight: bold; color: #fff; }
.team-name { color: #aaa; font-size: 11px; }
.brand { color: #fff; font-weight: bold; }
.model { color: #00a8ff; }
.time-data { font-family: monospace; font-weight: bold; text-align: right; }
.gap-data { color: #ff4d4d; font-family: monospace; text-align: right; }
.badge { padding: 2px 6px; font-size: 10px; font-weight: bold; border-radius: 3px; color: #fff; }
.hypercar { background-color: #d92525; }
.lmgt3 { background-color: #007acc; }
.pro { background-color: #47a847; }

/* Estilo do Botão/Link de Pilotos */
.pilotos-link-container { text-align: center; margin-top: 30px; margin-bottom: 10px; }
.pilotos-btn { background-color: #262626; color: #00a8ff; border: 1px solid #00a8ff; padding: 10px 20px; font-weight: bold; border-radius: 4px; text-decoration: none; display: inline-block; transition: 0.2s; }
.pilotos-btn:hover { background-color: #00a8ff; color: #fff; }
</style>
</head>
