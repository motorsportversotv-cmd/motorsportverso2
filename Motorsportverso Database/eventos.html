<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorsportverso - Eventos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #29292e;
            margin-bottom: 30px;
        }

        h1 {
            color: #e1e1e6;
            font-size: 1.8rem;
        }

        /* Status da Telemetria */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #202024;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #29292e;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #e52e2e; /* Vermelho por padrão */
            box-shadow: 0 0 8px #e52e2e;
            transition: all 0.3s ease;
        }

        .status-dot.online {
            background-color: #04d361; /* Verde quando conecta */
            box-shadow: 0 0 8px #04d361;
        }

        /* Navegação */
        nav {
            margin-bottom: 25px;
        }

        nav a {
            color: #a8a8b3;
            text-decoration: none;
            margin-right: 15px;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #04d361;
        }

        /* Tabela de Eventos */
        .table-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #29292e;
        }

        th {
            background-color: #121214;
            color: #04d361;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #29292e;
        }

        .categoria-tag {
            background-color: #29292e;
            color: #e1e1e6;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        a.link-evento {
            color: inherit;
            text-decoration: none;
        }

        a.link-evento:hover {
            color: #04d361;
        }
    </style>
</head>
<body>

    <header>
        <h1>Motorsportverso Database</h1>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">A conectar ao Servidor...</span>
        </div>
    </header>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="pilotos.html">Pilotos</a>
        <a href="programacao.html">Programação TV</a>
        <a href="eventos.html" class="active">Eventos</a>
    </nav>

    <main class="table-container">
        <h2>Calendário de Eventos</h2>
        <br>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Evento / Etapa</th>
                    <th>Categoria</th>
                    <th>Circuito / Local</th>
                    <th>Data</th>
                </tr>
            </thead>
            <tbody id="tabelaEventos">
                <tr>
                    <td colspan="5" style="text-align: center; color: #a8a8b3;">A carregar dados do servidor Java...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script>
        const API_URL = 'http://localhost:8080/api/eventos';

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const tabelaEventos = document.getElementById('tabelaEventos');

        // Evento padrão estático
        const eventoRioDoRastro = {
            id: 1,
            nome: "Rio do Rastro Hill Climb",
            categoria: "Hill Climb",
            circuito: "Serra do Rio do Rastro",
            data: "2026",
            link: "Motorsportverso Database/Friends_Hill_climb_Rio_do_rastro_2026.html"
        };

        function renderizarEventos(listaEventos) {
            tabelaEventos.innerHTML = '';

            listaEventos.forEach(evento => {
                const tr = document.createElement('tr');
                const link = evento.link || 'Friends_Hill_climb_Rio_do_rastro_2026.html';
                
                tr.innerHTML = `
                    <td>${evento.id || '-'}</td>
                    <td><strong><a href="${link}" class="link-evento">${evento.nome || evento.evento || '-'}</a></strong></td>
                    <td><span class="categoria-tag">${evento.categoria || 'Geral'}</span></td>
                    <td>${evento.circuito || evento.local || '-'}</td>
                    <td>${evento.data || '-'}</td>
                `;
                tabelaEventos.appendChild(tr);
            });
        }

        async function carregarEventos() {
            try {
                const resposta = await fetch(API_URL);
                
                if (resposta.ok) {
                    let eventos = await resposta.json();
                    
                    statusDot.classList.add('online');
                    statusText.innerText = 'Servidor Java Conectado';

                    // Se a API não trouxer o evento do Rio do Rastro, adiciona ele no topo da lista
                    const jaExiste = eventos.some(e => (e.nome || e.evento) === eventoRioDoRastro.nome);
                    if (!jaExiste) {
                        eventos.unshift(eventoRioDoRastro);
                    }

                    renderizarEventos(eventos);
                } else {
                    throw new Error('Servidor respondeu com erro');
                }
            } catch (erro) {
                console.error('Erro ao conectar ao Java:', erro);
                statusDot.classList.remove('online');
                statusText.innerText = 'Servidor Java Desconectado';
                
                // Exibe o evento do Rio do Rastro mesmo se o servidor estiver offline
                renderizarEventos([eventoRioDoRastro]);
            }
        }

        carregarEventos();
    </script>
</body>
</html>
