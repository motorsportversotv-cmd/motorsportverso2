<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorsportverso - Programação TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #29292e;
            margin-bottom: 30px;
        }

        h1 {
            color: #e1e1e6;
            font-size: 1.8rem;
        }

        /* Status da Telemetria */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #202024;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #29292e;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f1c40f;
            box-shadow: 0 0 8px #f1c40f;
            transition: all 0.3s ease;
        }

        /* Navegação */
        nav {
            margin-bottom: 25px;
        }

        nav a {
            color: #a8a8b3;
            text-decoration: none;
            margin-right: 15px;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #04d361;
        }

        /* Formulário de Cadastro */
        .form-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            margin-bottom: 25px;
        }

        .form-container h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #04d361;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: #a8a8b3;
        }

        .form-group input, .form-group select {
            background-color: #121214;
            border: 1px solid #29292e;
            color: #e1e1e6;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #04d361;
            outline: none;
        }

        .btn-cadastrar {
            grid-column: 1 / -1;
            background-color: #04d361;
            color: #121214;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cadastrar:hover {
            background-color: #04bf55;
        }

        /* Tabela de Programação */
        .table-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #29292e;
        }

        th {
            background-color: #121214;
            color: #04d361;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #29292e;
        }

        .canal-tag {
            background-color: #04d361;
            color: #121214;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <h1>Motorsportverso Database</h1>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Conectando à Planilha...</span>
        </div>
    </header>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="pilotos.html">Pilotos</a>
        <a href="programacao_tv_servidor.html" class="active">Programação TV</a>
        <a href="eventos.html">Eventos</a>
    </nav>

    <!-- Formulário de Novo Cadastro -->
    <section class="form-container">
        <h2>Adicionar Novo Evento / Transmissão (Direto na Planilha)</h2>
        <form id="formNovoEvento">
            <div class="form-grid">
                <div class="form-group">
                    <label for="inputHora">Hora</label>
                    <input type="time" id="inputHora" required>
                </div>
                <div class="form-group">
                    <label for="inputNome">Evento / Sessão</label>
                    <input type="text" id="inputNome" placeholder="Ex: F1 - Q / WEC - Corrida" required>
                </div>
                <div class="form-group">
                    <label for="inputCategoria">Categoria</label>
                    <input type="text" id="inputCategoria" placeholder="Ex: Formula, GT, Hypercar" required>
                </div>
                <div class="form-group">
                    <label for="inputCircuito">Circuito / Local</label>
                    <input type="text" id="inputCircuito" placeholder="Ex: Interlagos, Monza" required>
                </div>
                <div class="form-group">
                    <label for="inputData">Data</label>
                    <input type="date" id="inputData" required>
                </div>
                <div class="form-group">
                    <label for="inputCanal">Onde Assistir (Canal)</label>
                    <select id="inputCanal" required>
                        <option value="" disabled selected>Selecione o canal...</option>
                        <option value="Youtube">Youtube</option>
                        <option value="Twitch">Twitch</option>
                        <option value="ESPN">ESPN</option>
                        <option value="Sportv 2 ou 3 BR">Sportv 2 ou 3 BR</option>
                        <option value="Sportv 4 Port">Sportv 4 Port</option>
                        <option value="Facebook">Facebook</option>
                        <option value="DAZN">DAZN</option>
                        <option value="Bandsports">Bandsports</option>
                        <option value="Band">Band</option>
                        <option value="SBT">SBT</option>
                        <option value="NSports">NSports</option>
                        <option value="Kick TV">Kick TV</option>
                        <option value="Globo">Globo</option>
                    </select>
                </div>
            </div>
            <br>
            <button type="submit" class="btn-cadastrar">Salvar na Planilha</button>
        </form>
    </section>

    <main class="table-container">
        <h2>Programação de TV e Transmissões</h2>
        <br>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Hora</th>
                    <th>Evento / Sessão</th>
                    <th>Categoria</th>
                    <th>Circuito</th>
                    <th>Data</th>
                    <th>Onde Assistir (Canal)</th>
                </tr>
            </thead>
            <tbody id="tabelaProgramacao">
                <!-- Preenchido automaticamente via JavaScript -->
            </tbody>
        </table>
    </main>

    <script>
        // ATENÇÃO: Cole aqui a URL gerada pelo SheetDB
        const URL_SHEETDB = "https://sheetdb.io/api/v1/iu6bb038dba2o";

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // Formata a data de AAAA-MM-DD para DD/MM/AAAA
        function formatarData(dataString) {
            if(!dataString) return '';
            const partes = dataString.split('-');
            if(partes.length !== 3) return dataString;
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        // 1. LER DADOS DA PLANILHA DIRETO DO NAVEGADOR (GET)
        function carregarProgramacao() {
            fetch(URL_SHEETDB)
                .then(response => response.json())
                .then(dados => {
                    const tabela = document.getElementById('tabelaProgramacao');
                    tabela.innerHTML = ''; 

                    if (!dados || dados.length === 0 || dados.error) {
                        tabela.innerHTML = '<tr><td colspan="7" style="text-align:center;">Nenhum evento agendado na planilha.</td></tr>';
                    } else {
                        // O index + 1 serve como ID da linha
                        dados.forEach((evento, index) => {
                            const linha = document.createElement('tr');
                            linha.innerHTML = `
                                <td>#${index + 1}</td>
                                <td>${evento.hora || ''}</td>
                                <td><strong>${evento.evento || ''}</strong></td>
                                <td>${evento.categoria || ''}</td>
                                <td>${evento.circuito || ''}</td>
                                <td>${formatarData(evento.data)}</td>
                                <td><span class="canal-tag">${evento.canal || ''}</span></td>
                            `;


tabela.appendChild(linha);
});
}
statusDot.style.backgroundColor = '#04d361';
statusDot.style.boxShadow = '0 0 8px #04d361';
statusText.innerText = 'Planilha Conectada';
})
.catch(error => {
console.error('Erro ao ler planilha:', error);
statusDot.style.backgroundColor = '#ff4444';
statusDot.style.boxShadow = '0 0 8px #ff4444';
statusText.innerText = 'Erro de Conexão com a Planilha';
});
}
// 2. SALVAR DADOS NA PLANILHA DIRETO DO NAVEGADOR (POST)
document.getElementById('formNovoEvento').addEventListener('submit', function(e) {
e.preventDefault();
const btn = e.target.querySelector('button');
btn.innerText = "Gravando na planilha...";
btn.disabled = true;
// Os nomes das propriedades devem ser idênticos aos cabeçalhos criados no Passo 1
const novoEvento = {
data: [{
hora: document.getElementById('inputHora').value,
evento: document.getElementById('inputNome').value,
categoria: document.getElementById('inputCategoria').value,
circuito: document.getElementById('inputCircuito').value,
data: document.getElementById('inputData').value,
canal: document.getElementById('inputCanal').value
}]
};
fetch(URL_SHEETDB, {
method: 'POST',
headers: {
'Accept': 'application/json',
'Content-Type': 'application/json'
},
body: JSON.stringify(novoEvento)
})
.then(response => response.json())
.then(resposta => {
if(resposta.created) {
alert('Transmissão salva com sucesso na planilha!');
document.getElementById('formNovoEvento').reset();
carregarProgramacao(); // Atualiza a tabela na hora
} else {
alert('A API respondeu mas não conseguiu criar a linha.');
}
})
.catch(error => {
console.error('Erro no envio:', error);
alert('Erro ao se comunicar com a planilha.');
})
.finally(() => {
btn.innerText = "Salvar na Planilha";
btn.disabled = false;
});
});
// Carrega as linhas assim que abre o site
window.onload = carregarProgramacao;
