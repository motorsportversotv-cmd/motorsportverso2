<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorsportverso - Programação TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #29292e;
            margin-bottom: 30px;
        }

        h1 {
            color: #e1e1e6;
            font-size: 1.8rem;
        }

        /* Status da Telemetria */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #202024;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #29292e;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f1c40f;
            box-shadow: 0 0 8px #f1c40f;
            transition: all 0.3s ease;
        }

        /* Navegação */
        nav {
            margin-bottom: 25px;
        }

        nav a {
            color: #a8a8b3;
            text-decoration: none;
            margin-right: 15px;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #04d361;
        }

        /* Formulário de Cadastro */
        .form-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            margin-bottom: 25px;
        }

        .form-container h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #04d361;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: #a8a8b3;
        }

        .form-group input, .form-group select {
            background-color: #121214;
            border: 1px solid #29292e;
            color: #e1e1e6;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #04d361;
            outline: none;
        }

        .btn-cadastrar {
            grid-column: 1 / -1;
            background-color: #04d361;
            color: #121214;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cadastrar:hover {
            background-color: #04bf55;
        }

        .btn-cancelar {
            background-color: #e74c3c !important;
            margin-top: 10px;
            display: none;
        }

        /* Tabela de Programação */
        .table-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #29292e;
        }

        th {
            background-color: #121214;
            color: #04d361;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #29292e;
        }

        .canal-tag {
            background-color: #04d361;
            color: #121214;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }

        .btn-acao {
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-right: 4px;
        }

        .btn-editar {
            background-color: #f1c40f;
            color: #121214;
        }

        .btn-excluir {
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>

    <!-- Formulário de Novo Cadastro / Edição -->
    <section class="form-container">

        <form id="formNovoEvento">

            <div class="form-grid">

                    <input type="time" id="inputHora" required>
                </div>

                        <option value="Band">Band</option>
                        <option value="SBT">SBT</option>
                        <option value="NSports">NSports</option>
                        <option value="Kick TV">Kick TV</option>
                        <option value="Globo">Globo</option>
                    </select>
                </div>
            </div>
            <br>
            <button type="submit" id="btnSubmit" class="btn-cadastrar">Salvar na Planilha</button>
            <button type="button" id="btnCancelar" class="btn-cadastrar btn-cancelar" onclick="cancelarEdicao()">Cancelar Edição</button>
        </form>
    </section>

            </thead>

            </tbody>
        </table>
    </main>

        function excelDateToInputFormat(serial) {
            if (!serial) return '';
            if (!isNaN(serial)) {
                const utc_days = Math.floor(serial - 25569);
                const dateObj = new Date(utc_days * 86400 * 1000);
                const year = dateObj.getUTCFullYear();
                const month = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getUTCDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            if (typeof serial === 'string' && serial.includes('-')) return serial; 
            if (typeof serial === 'string' && serial.includes('/')) {
                const p = serial.split('/');
                if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
            }
            return '';
        }

        function excelDateToDMY(serial) {
            if (!serial || isNaN(serial)) {
                if (typeof serial === 'string' && serial.includes('-')) {
                    const partes = serial.split('-');
                    if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
                return serial || '';
            }
            const utc_days = Math.floor(serial - 25569);
            const dateObj = new Date(utc_days * 86400 * 1000);
            const day = String(dateObj.getUTCDate()).padStart(2, '0');
            const month = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
            const year = dateObj.getUTCFullYear();
            return `${day}/${month}/${year}`;
        }

        function excelTimeToHHMM(excelTime) {
            if (typeof excelTime === 'number' || (!isNaN(excelTime) && excelTime !== '')) {
                const num = Number(excelTime);
                const totalMinutes = Math.round(num * 24 * 60);
                const hours = String(Math.floor(totalMinutes / 60) % 24).padStart(2, '0');
                const minutes = String(totalMinutes % 60).padStart(2, '0');
                return `${hours}:${minutes}`;
            }
            return excelTime || ''; 
        }

        function parseDataParaComparacao(dataStr) {
            if (!dataStr) return 0;
            if (!isNaN(dataStr)) return Number(dataStr);
            if (dataStr.includes('-')) return dataStr;
            if (dataStr.includes('/')) {
                const p = dataStr.split('/');
                if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
            }
            return dataStr;
        }

        function parseHoraParaMinutos(horaStr) {
            if (typeof horaStr === 'number' || !isNaN(horaStr)) {
                return Number(horaStr) * 24 * 60;
            }
            if (typeof horaStr === 'string' && horaStr.includes(':')) {
                const partes = horaStr.split(':');
                return (parseInt(partes[0]) || 0) * 60 + (parseInt(partes[1]) || 0);
            }
            return 0;
        }
