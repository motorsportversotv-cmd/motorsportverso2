<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorsportverso - Programação TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #29292e;
            margin-bottom: 30px;
        }

        h1 {
            color: #e1e1e6;
            font-size: 1.8rem;
        }

        /* Status da Telemetria */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #202024;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #29292e;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #e52e2e;
            box-shadow: 0 0 8px #e52e2e;
            transition: all 0.3s ease;
        }

        .status-dot.online {
            background-color: #04d361;
            box-shadow: 0 0 8px #04d361;
        }

        /* Navegação */
        nav {
            margin-bottom: 25px;
        }

        nav a {
            color: #a8a8b3;
            text-decoration: none;
            margin-right: 15px;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #04d361;
        }

        /* Formulário de Cadastro */
        .form-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            margin-bottom: 25px;
        }

        .form-container h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #04d361;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: #a8a8b3;
        }

        .form-group input, .form-group select {
            background-color: #121214;
            border: 1px solid #29292e;
            color: #e1e1e6;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #04d361;
            outline: none;
        }

        .btn-cadastrar {
            grid-column: 1 / -1;
            background-color: #04d361;
            color: #121214;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cadastrar:hover {
            background-color: #04bf55;
        }

        /* Tabela de Programação */
        .table-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #29292e;
        }

        th {
            background-color: #121214;
            color: #04d361;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #29292e;
        }

        .canal-tag {
            background-color: #04d361;
            color: #121214;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        a.link-evento {
            color: inherit;
            text-decoration: none;
        }

        a.link-evento:hover {
            color: #04d361;
        }
    </style>
</head>
<body>

    <header>
        <h1>Motorsportverso Database</h1>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">A ligar ao Servidor...</span>
        </div>
    </header>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="pilotos.html">Pilotos</a>
        <a href="programacao_tv_servidor.html" class="active">Programação TV</a>
        <a href="eventos.html">Eventos</a>
    </nav>

    <!-- Formulário de Novo Cadastro -->
    <section class="form-container">
        <h2>Adicionar Novo Evento / Transmissão</h2>
        <form id="formNovoEvento">
            <div class="form-grid">
                <div class="form-group">
                    <label for="inputHora">Hora</label>
                    <input type="time" id="inputHora" required>
                </div>
                <div class="form-group">
                    <label for="inputNome">Evento / Sessão</label>
                    <input type="text" id="inputNome" placeholder="Ex: F1 - Q / WEC - Corrida" required>
                </div>
                <div class="form-group">
                    <label for="inputCategoria">Categoria</label>
                    <input type="text" id="inputCategoria" placeholder="Ex: Formula, GT, Hypercar" required>
                </div>
                <div class="form-group">
                    <label for="inputCircuito">Circuito / Local</label>
                    <input type="text" id="inputCircuito" placeholder="Ex: Interlagos, Monza" required>
                </div>
                <div class="form-group">
                    <label for="inputData">Data</label>
                    <input type="date" id="inputData" required>
                </div>
                <div class="form-group">
                    <label for="inputCanal">Onde Assistir (Canal)</label>
                    <select id="inputCanal" required>
                        <option value="" disabled selected>Selecione o canal...</option>
                        <option value="Youtube">Youtube</option>
                        <option value="Twitch">Twitch</option>
                        <option value="ESPN">ESPN</option>
                        <option value="Sportv 2 ou 3 BR">Sportv 2 ou 3 BR</option>
                        <option value="Sportv 4 Port">Sportv 4 Port</option>
                        <option value="Facebook">Facebook</option>
                        <option value="DAZN">DAZN</option>
                        <option value="Bandsports">Bandsports</option>
                        <option value="Band">Band</option>
                        <option value="SBT">SBT</option>
                        <option value="NSports">NSports</option>
                        <option value="Kick TV">Kick TV</option>
                        <option value="Globo">Globo</option>
                    </select>
                </div>
            </div>
            <br>
            <button type="submit" class="btn-cadastrar">Salvar no Servidor</button>
        </form>
    </section>

    <main class="table-container">
        <h2>Programação de TV e Transmissões</h2>
        <br>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Hora</th>
                    <th>Evento / Sessão</th>
                    <th>Categoria</th>
                    <th>Circuito</th>
                    <th>Data</th>
                    <th>Onde Assistir (Canal)</th>
                </tr>
            </thead>
            <tbody id="tabelaProgramacao">
                <tr>
                    <td colspan="7" style="text-align: center; color: #a8a8b3;">A carregar programação...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script>
        const API_URL = 'http://localhost:8080/api/programacao';

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const tabelaProgramacao = document.getElementById('tabelaProgramacao');
        const formNovoEvento = document.getElementById('formNovoEvento');

        const eventosEstaticos = [
            { id: 1, hora: "16:30", nome: "Porsche Cup Brasil - Challenge - Qualifying", categoria: "GT", circuito: "Interlagos", data: "05/11/2026", canal: "Youtube", link: "#" },
            { id: 2, hora: "12:30", nome: "F1 - FP1", categoria: "Formula", circuito: "Interlagos", data: "06/11/2026", canal: "Sportv 2 ou 3 BR", link: "#" },
            { id: 3, hora: "14:00", nome: "Porsche Cup Brasil - Challenge - Race 1", categoria: "GT", circuito: "Interlagos", data: "06/11/2026", canal: "Youtube", link: "#" },
            { id: 4, hora: "15:00", nome: "Porsche Cup Brasil - 992 - Qualifying", categoria: "GT", circuito: "Interlagos", data: "06/11/2026", canal: "Youtube", link: "#" },
            { id: 5, hora: "21:30", nome: "Nascar Truck Series", categoria: "Nascar", circuito: "Homestead", data: "06/11/2026", canal: "ESPN 3", link: "#" }
        ];

        function renderizarProgramacao(lista) {
            tabelaProgramacao.innerHTML = '';

            lista.forEach((item, index) => {
                const tr = document.createElement('tr');
                const link = item.link || '#';
                const itemId = item.id || (index + 1);
                
                tr.innerHTML = `
                    <td>#${itemId}</td>
                    <td>${item.hora || '-'}</td>
                    <td><strong><a href="${link}" class="link-evento">${item.nome || item.evento || '-'}</a></strong></td>
                    <td><span style="color: #a8a8b3;">${item.categoria || 'Geral'}</span></td>
                    <td>${item.circuito || item.local || '-'}</td>
                    <td>${item.data || '-'}</td>
                    <td><span class="canal-tag">${item.canal || 'Transmissão Oficial'}</span></td>
                `;
                tabelaProgramacao.appendChild(tr);
            });
        }

        async function carregarProgramacao() {
            try {
                const resposta = await fetch(API_URL);
                if (resposta.ok) {
                    let dados = await resposta.json();
                    statusDot.classList.add('online');
                    statusText.innerText = 'Servidor Java Conectado';

                    eventosEstaticos.forEach(estatico => {
                        if (!dados.some(e => (e.nome || e.evento) === estatico.nome)) {
                            dados.push(estatico);
                        }
                    });
                    renderizarProgramacao(dados);
                } else {
                    throw new Error();
                }
            } catch (erro) {
                statusDot.classList.remove('online');
                statusText.innerText = 'Servidor Java Desconectado';
                renderizarProgramacao(eventosEstaticos);
            }
        }

        // Envio do formulário salvando diretamente no Servidor Java via POST
        formNovoEvento.addEventListener('submit', async (e) => {
            e.preventDefault();

            const dataInput = document.getElementById('inputData').value;
            let dataFormatada = dataInput;
            if (dataInput.includes('-')) {
                const partes = dataInput.split('-');
                dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;
            }

            const novoEvento = {
                hora: document.getElementById('inputHora').value,
                nome: document.getElementById('inputNome').value,
                categoria: document.getElementById('inputCategoria').value,
                circuito: document.getElementById('inputCircuito').value,
                data: dataFormatada,
                canal: document.getElementById('inputCanal').value,
                link: "#"
            };

            try {
                const resposta = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(novoEvento)
                });

                if (resposta.ok) {
                    alert('Evento salvo com sucesso no servidor!');
                    formNovoEvento.reset();
                    carregarProgramacao();
                } else {
                    alert('Erro ao salvar no servidor. Verifique a API.');
                }
            } catch (erro) {
                console.error('Erro de conexão:', erro);
                alert('Não foi possível conectar ao servidor Java para salvar o evento.');
            }
        });

        carregarProgramacao();
    </script>
</body>
</html>
