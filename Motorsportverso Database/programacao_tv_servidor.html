<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorsportverso - Programação TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #29292e;
            margin-bottom: 30px;
        }

        h1 {
            color: #e1e1e6;
            font-size: 1.8rem;
        }

        /* Status da Telemetria */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #202024;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #29292e;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #e52e2e;
            box-shadow: 0 0 8px #e52e2e;
            transition: all 0.3s ease;
        }

        .status-dot.online {
            background-color: #04d361;
            box-shadow: 0 0 8px #04d361;
        }

        /* Navegação */
        nav {
            margin-bottom: 25px;
        }

        nav a {
            color: #a8a8b3;
            text-decoration: none;
            margin-right: 15px;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #04d361;
        }

        /* Formulário de Cadastro */
        .form-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            margin-bottom: 25px;
        }

        .form-container h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #04d361;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: #a8a8b3;
        }

        .form-group input, .form-group select {
            background-color: #121214;
            border: 1px solid #29292e;
            color: #e1e1e6;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #04d361;
            outline: none;
        }

        .btn-cadastrar {
            grid-column: 1 / -1;
            background-color: #04d361;
            color: #121214;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cadastrar:hover {
            background-color: #04bf55;
        }

        /* Tabela de Programação */
        .table-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #29292e;
        }

        th {
            background-color: #121214;
            color: #04d361;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #29292e;
        }

        .canal-tag {
            background-color: #04d361;
            color: #121214;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        a.link-evento {
            color: inherit;
            text-decoration: none;
        }

        a.link-evento:hover {
            color: #04d361;
        }
    </style>
</head>
<body>

    <header>
        <h1>Motorsportverso Database</h1>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">A ligar ao Servidor...</span>
        </div>
    </header>

    <nav>

        <a href="programacao_tv_servidor.html" class="active">Programação TV</a>
        <a href="eventos.html">Eventos</a>
    </nav>
