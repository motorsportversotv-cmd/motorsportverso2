<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorsportverso - Programação TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #29292e;
            margin-bottom: 30px;
        }

        h1 {
            color: #e1e1e6;
            font-size: 1.8rem;
        }

        /* Status da Telemetria */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #202024;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #29292e;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .status-badge:hover {
            border-color: #04d361;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f1c40f;
            box-shadow: 0 0 8px #f1c40f;
            transition: all 0.3s ease;
        }

        /* Navegação */
        nav {
            margin-bottom: 25px;
        }

        nav a {
            color: #a8a8b3;
            text-decoration: none;
            margin-right: 15px;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #04d361;
        }

        /* Formulário de Cadastro */
        .form-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            margin-bottom: 25px;
        }

        .form-container h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #04d361;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: #a8a8b3;
        }

        .form-group input, .form-group select {
            background-color: #121214;
            border: 1px solid #29292e;
            color: #e1e1e6;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #04d361;
            outline: none;
        }

        .btn-cadastrar {
            grid-column: 1 / -1;
            background-color: #04d361;
            color: #121214;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cadastrar:hover {
            background-color: #04bf55;
        }

        .btn-cancelar {
            background-color: #e74c3c !important;
            margin-top: 10px;
            display: none;
        }

        /* Tabela de Programação */
        .table-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #29292e;
        }

        th {
            background-color: #121214;
            color: #04d361;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #29292e;
        }

        .canal-tag {
            background-color: #04d361;
            color: #121214;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }

        .btn-link-abrir {
            background-color: #3498db;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-link-abrir:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }

        .btn-link-abrir.secundario {
            background-color: #9b59b6;
        }

        .btn-link-abrir.secundario:hover {
            background-color: #8e44ad;
        }

        .btn-acao {
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-right: 4px;
        }

        .btn-editar {
            background-color: #f1c40f;
            color: #121214;
        }

        .btn-excluir {
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Motorsportverso Database</h1>
        <div class="status-badge" onclick="carregarProgramacao()" title="Clique para atualizar a conexão">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Conectando à Planilha...</span>
        </div>
    </header>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="pilotos.html">Pilotos</a>
        <a href="programacao_tv_servidor.html" class="active">Programação TV</a>
        <a href="eventos.html">Eventos</a>
    </nav>

    <section class="form-container">
        <h2 id="formTitle">Adicionar Novo Evento / Transmissão (Direto na Planilha)</h2>
        <form id="formNovoEvento">
            <input type="hidden" id="editIndex">
            <div class="form-grid">
                <div class="form-group">
                    <label for="inputHora">Hora</label>
                    <input type="time" id="inputHora" required>
                </div>
                <div class="form-group">
                    <label for="inputNome">Evento / Sessão</label>
                    <input type="text" id="inputNome" placeholder="Ex: F1 - Q / WEC - Corrida" required>
                </div>
                <div class="form-group">
                    <label for="inputCategoria">Categoria</label>
                    <input type="text" id="inputCategoria" placeholder="Ex: Formula, GT, Hypercar" required>
                </div>
                <div class="form-group">
                    <label for="inputCircuito">Circuito / Local</label>
                    <input type="text" id="inputCircuito" placeholder="Ex: Interlagos, Monza" required>
                </div>
                <div class="form-group">
                    <label for="inputData">Data</label>
                    <input type="date" id="inputData" required>
                </div>
                <div class="form-group">
                    <label for="inputCanal">Onde Assistir (Canal)</label>
                    <select id="inputCanal" required>
                        <option value="" disabled selected>Selecione o canal...</option>
                        <option value="Youtube">Youtube</option>
                        <option value="Twitch">Twitch</option>
                        <option value="ESPN">ESPN</option>
                        <option value="Sportv 2 ou 3 BR">Sportv 2 ou 3 BR</option>
                        <option value="Sportv 4 Port">Sportv 4 Port</option>
                        <option value="Facebook">Facebook</option>
                        <option value="DAZN">DAZN</option>
                        <option value="Bandsports">Bandsports</option>
                        <option value="Band">Band</option>
                        <option value="SBT">SBT</option>
                        <option value="NSports">NSports</option>
                        <option value="Kick TV">Kick TV</option>
                        <option value="Globo">Globo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="inputLink1">Link 1 (Principal)</label>
                    <input type="text" id="inputLink1" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="inputLink2">Link 2 (Secundário)</label>
                    <input type="text" id="inputLink2" placeholder="https://...">
                </div>
            </div>
            <br>
            <button type="submit" id="btnSubmit" class="btn-cadastrar">Salvar na Planilha</button>
            <button type="button" id="btnCancelar" class="btn-cadastrar btn-cancelar" onclick="cancelarEdicao()">Cancelar Edição</button>
        </form>
    </section>

    <main class="table-container">
        <h2>Programação de TV e Transmissões</h2>
        <br>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Hora</th>
                    <th>Evento / Sessão</th>
                    <th>Categoria</th>
                    <th>Circuito</th>
                    <th>Data</th>
                    <th>Canal</th>
                    <th>Link 1</th>
                    <th>Link 2</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaProgramacao">
                <tr><td colspan="10" style="text-align:center; color: #a8a8b3;">Carregando dados do servidor...</td></tr>
            </tbody>
        </table>
    </main>

    <script>
        const URL_SHEETDB = "https://sheetdb.io/api/v1/iu6bb038dba2o";
        let listaDadosGlobal = [];

        function atualizarStatus(cor, texto) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            if (statusDot && statusText) {
                statusDot.style.backgroundColor = cor;
                statusDot.style.boxShadow = `0 0 8px ${cor}`;
                statusText.innerText = texto;
            }
        }

        function excelDateToInputFormat(serial) {
            if (!serial) return '';
            if (!isNaN(serial)) {
                const utc_days = Math.floor(serial - 25569);
                const dateObj = new Date(utc_days * 86400 * 1000);
                const year = dateObj.getUTCFullYear();
                const month = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getUTCDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            if (typeof serial === 'string' && serial.includes('-')) return serial;
            if (typeof serial === 'string' && serial.includes('/')) {
                const p = serial.split('/');
                if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
            }
            return '';
        }

        function excelDateToDMY(serial) {
            if (!serial || isNaN(serial)) {
                if (typeof serial === 'string' && serial.includes('-')) {
                    const partes = serial.split('-');
                    if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
                return serial || '';
            }
            const utc_days = Math.floor(serial - 25569);
            const dateObj = new Date(utc_days * 86400 * 1000);
            const day = String(dateObj.getUTCDate()).padStart(2, '0');
            const month = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
            const year = dateObj.getUTCFullYear();
            return `${day}/${month}/${year}`;
        }

        function excelTimeToHHMM(excelTime) {
            if (typeof excelTime === 'number' || (!isNaN(excelTime) && excelTime !== '')) {
                const num = Number(excelTime);
                const totalMinutes = Math.round(num * 24 * 60);
                const hours = String(Math.floor(totalMinutes / 60) % 24).padStart(2, '0');
                const minutes = String(totalMinutes % 60).padStart(2, '0');
                return `${hours}:${minutes}`;
            }
            return excelTime || '';
        }

        function parseDataParaComparacao(dataStr) {
            if (!dataStr) return 0;
            if (!isNaN(dataStr)) return Number(dataStr);
            if (typeof dataStr === 'string' && dataStr.includes('-')) return dataStr;
            if (typeof dataStr === 'string' && dataStr.includes('/')) {
                const p = dataStr.split('/');
                if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
            }
            return String(dataStr);
        }

        function parseHoraParaMinutos(horaStr) {
            if (typeof horaStr === 'number' || (!isNaN(horaStr) && horaStr !== '')) {
                return Number(horaStr) * 24 * 60;
            }
            if (typeof horaStr === 'string' && horaStr.includes(':')) {
                const partes = horaStr.split(':');
                return (parseInt(partes[0]) || 0) * 60 + (parseInt(partes[1]) || 0);
            }
            return 0;
        }

        function formatarUrl(url) {
            if (!url) return '';
            const trimmed = String(url).trim();
            if (!trimmed || trimmed === '--') return '';
            if (!/^https?:\/\//i.test(trimmed)) {
                return 'https://' + trimmed;
            }
            return trimmed;
        }

        async function carregarProgramacao() {
            const tabela = document.getElementById('tabelaProgramacao');
            atualizarStatus('#f1c40f', 'Conectando à Planilha...');
            tabela.innerHTML = '<tr><td colspan="10" style="text-align:center; color: #a8a8b3;">Carregando dados do servidor...</td></tr>';

            try {
                const response = await fetch(URL_SHEETDB);
                if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);

                const dados = await response.json();
                tabela.innerHTML = '';

                if (!Array.isArray(dados) || dados.length === 0) {
                    tabela.innerHTML = '<tr><td colspan="10" style="text-align:center;">Nenhum evento agendado na planilha.</td></tr>';
                    listaDadosGlobal = [];
                } else {
                    dados.sort((a, b) => {
                        const dataA = parseDataParaComparacao(a.data);
                        const dataB = parseDataParaComparacao(b.data);
                        if (dataA < dataB) return -1;
                        if (dataA > dataB) return 1;
                        return parseHoraParaMinutos(a.hora) - parseHoraParaMinutos(b.hora);
                    });

                    listaDadosGlobal = dados;

                    dados.forEach((evento, index) => {
                        const horaFormatada = excelTimeToHHMM(evento.hora);
                        const dataFormatada = excelDateToDMY(evento.data);
                        
                        // Garante mapeamento flexível caso venha com L maiúsculo (Link1/Link2) ou minúsculo (link1/link2)
                        const rawLink1 = evento.link1 || evento.Link1 || '';
                        const rawLink2 = evento.link2 || evento.Link2 || '';

                        const link1 = formatarUrl(rawLink1);
                        const link2 = formatarUrl(rawLink2);

                        const htmlLink1 = link1
                            ? `<a href="${link1}" target="_blank" rel="noopener noreferrer" class="btn-link-abrir">🌐 Abrir Link 1</a>`
                            : `<span style="color: #666; font-size: 0.8rem;">—</span>`;

                        const htmlLink2 = link2
                            ? `<a href="${link2}" target="_blank" rel="noopener noreferrer" class="btn-link-abrir secundario">🌐 Abrir Link 2</a>`
                            : `<span style="color: #666; font-size: 0.8rem;">—</span>`;

                        const linha = document.createElement('tr');
                        linha.innerHTML = `
                            <td>#${index + 1}</td>
                            <td>${horaFormatada}</td>
                            <td><strong>${evento.evento || ''}</strong></td>
                            <td>${evento.categoria || ''}</td>
                            <td>${evento.circuito || ''}</td>
                            <td>${dataFormatada}</td>
                            <td><span class="canal-tag">${evento.canal || ''}</span></td>
                            <td>${htmlLink1}</td>
                            <td>${htmlLink2}</td>
                            <td>
                                <button class="btn-acao btn-editar" onclick="prepararEdicao(${index})">Editar</button>
                                <button class="btn-acao btn-excluir" onclick="excluirEvento(${index})">Excluir</button>
                            </td>
                        `;
                        tabela.appendChild(linha);
                    });
                }

                atualizarStatus('#04d361', 'Planilha Conectada');
            } catch (error) {
                console.error('Erro ao ler planilha:', error);
                atualizarStatus('#ff4444', 'Erro de Conexão');
                tabela.innerHTML = `<tr><td colspan="10" style="text-align:center; color: #ff4444;">Erro ao carregar dados. Clique no status acima para tentar novamente.</td></tr>`;
            }
        }

        document.getElementById('formNovoEvento').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const editIndex = document.getElementById('editIndex').value;

            const horaVal = document.getElementById('inputHora').value;
            const eventoVal = document.getElementById('inputNome').value;
            const categoriaVal = document.getElementById('inputCategoria').value;
            const circuitoVal = document.getElementById('inputCircuito').value;
            const dataVal = document.getElementById('inputData').value;
            const canalVal = document.getElementById('inputCanal').value;
            const link1Val = formatarUrl(document.getElementById('inputLink1').value);
            const link2Val = formatarUrl(document.getElementById('inputLink2').value);

            btn.innerText = "Gravando na planilha...";
            btn.disabled = true;

            if (editIndex === "") {
                const novoEvento = {
                    data: [{
                        hora: horaVal,
                        evento: eventoVal,
                        categoria: categoriaVal,
                        circuito: circuitoVal,
                        data: dataVal,
                        canal: canalVal,
                        link1: link1Val,
                        link2: link2Val
                    }]
                };

                fetch(URL_SHEETDB, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify(novoEvento)
                })
                .then(res => res.json())
                .then(resposta => {
                    if (resposta.created) {
                        alert('Transmissão salva com sucesso!');
                        document.getElementById('formNovoEvento').reset();
                        carregarProgramacao();
                    } else {
                        alert('Erro ao criar registro.');
                    }
                })
                .catch(() => alert('Erro de comunicação.'))
                .finally(() => { btn.innerText = "Salvar na Planilha"; btn.disabled = false; });

            } else {
                const itemOriginal = listaDadosGlobal[editIndex];
                const urlUpdate = `${URL_SHEETDB}/evento/${encodeURIComponent(itemOriginal.evento)}`;

                const dadosAtualizados = {
                    data: {
                        hora: horaVal,
                        evento: eventoVal,
                        categoria: categoriaVal,
                        circuito: circuitoVal,
                        data: dataVal,
                        canal: canalVal,
                        link1: link1Val,
                        link2: link2Val
                    }
                };

                fetch(urlUpdate, {
                    method: 'PUT',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosAtualizados)
                })
                .then(res => res.json())
