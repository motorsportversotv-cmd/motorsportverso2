<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorsportverso - Programação TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #29292e;
            margin-bottom: 30px;
        }

        h1 {
            color: #e1e1e6;
            font-size: 1.8rem;
        }

        /* Status da Telemetria */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #202024;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #29292e;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #e52e2e; /* Vermelho por padrão */
            box-shadow: 0 0 8px #e52e2e;
            transition: all 0.3s ease;
        }

        .status-dot.online {
            background-color: #04d361; /* Verde quando conecta */
            box-shadow: 0 0 8px #04d361;
        }

        /* Navegação */
        nav {
            margin-bottom: 25px;
        }

        nav a {
            color: #a8a8b3;
            text-decoration: none;
            margin-right: 15px;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #04d361;
        }

        /* Tabela de Programação */
        .table-container {
            background-color: #202024;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #29292e;
        }

        th {
            background-color: #121214;
            color: #04d361;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #29292e;
        }

        .canal-tag {
            background-color: #04d361;
            color: #121214;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        a.link-evento {
            color: inherit;
            text-decoration: none;
        }

        a.link-evento:hover {
            color: #04d361;
        }
    </style>
</head>
<body>

    <header>
        <h1>Motorsportverso Database</h1>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">A conectar ao Servidor...</span>
        </div>
    </header>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="pilotos.html">Pilotos</a>
        <a href="programacao_tv_servidor.html" class="active">Programação TV</a>
        <a href="eventos.html">Eventos</a>
    </nav>

    <main class="table-container">
        <h2>Programação de TV e Transmissões</h2>
        <br>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Hora</th>
                    <th>Evento / Sessão</th>
                    <th>Categoria</th>
                    <th>Circuito</th>
                    <th>Data</th>
                    <th>Onde Assistir (Canal)</th>
                </tr>
            </thead>
            <tbody id="tabelaProgramacao">
                <tr>
                    <td colspan="7" style="text-align: center; color: #a8a8b3;">A carregar programação do servidor Java...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script>
        const API_URL = 'http://localhost:8080/api/programacao';

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const tabelaProgramacao = document.getElementById('tabelaProgramacao');

        // Eventos padrão estáticos
        const eventoPorscheCupQualy = {
            id: 1,
            hora: "16:30",
            nome: "Porsche Cup Brasil - Challenge - Qualifying",
            categoria: "GT",
            circuito: "Interlagos",
            data: "05/11/2026",
            canal: "Youtube Esporte na Band / Porsche Cup Brasil",
            link: "Friends_Hill_climb_Rio_do_rastro_2026.html"
        };

        const eventoF1FP1 = {
            id: 2,
            hora: "12:30",
            nome: "F1 - FP1",
            categoria: "Formula",
            circuito: "Interlagos",
            data: "06/11/2026",
            canal: "Globoplay / SporTV",
            link: "Friends_Hill_climb_Rio_do_rastro_2026.html"
        };

        const eventoPorscheCupRace1 = {
            id: 3,
            hora: "14:00",
            nome: "Porsche Cup Brasil - Challenge - Race 1",
            categoria: "GT",
            circuito: "Interlagos",
            data: "06/11/2026",
            canal: "Youtube Esporte na Band / Porsche Cup Brasil",
            link: "Friends_Hill_climb_Rio_do_rastro_2026.html"
        };

        const eventoPorscheCup992Qualyfing = {
            id: 4,
            hora: "15:00",
            nome: "Porsche Cup Brasil - 992 - Qualifying",
            categoria: "GT",
            circuito: "Interlagos",
            data: "06/11/2026",
            canal: "Youtube Esporte na Band / Porsche Cup Brasil",
            link: "Friends_Hill_climb_Rio_do_rastro_2026.html"
        };

        const eventosEstaticos = [eventoPorscheCupQualy, eventoF1FP1, eventoPorscheCupRace1, eventoPorscheCup992Qualyfing];

        function renderizarProgramacao(lista) {
            tabelaProgramacao.innerHTML = '';

            lista.forEach((item, index) => {
                const tr = document.createElement('tr');
                const link = item.link || '#';
                const itemId = item.id || (index + 1);
                
                tr.innerHTML = `
                    <td>${itemId}</td>
                    <td>${item.hora || '-'}</td>
                    <td><strong><a href="${link}" class="link-evento">${item.nome || item.evento || '-'}</a></strong></td>
                    <td><span style="color: #a8a8b3;">${item.categoria || 'Geral'}</span></td>
                    <td>${item.circuito || item.local || '-'}</td>
                    <td>${item.data || '-'}</td>
                    <td><span class="canal-tag">${item.canal || 'Transmissão Oficial'}</span></td>
                `;
                tabelaProgramacao.appendChild(tr);
            });
        }

        async function carregarProgramacao() {
            try {
                const resposta = await fetch(API_URL);
                
                if (resposta.ok) {
                    let dados = await resposta.json();
                    
                    statusDot.classList.add('online');
                    statusText.innerText = 'Servidor Java Conectado';

                    // Insere eventos estáticos caso não estejam presentes nos dados vindos da API
                    eventosEstaticos.forEach(eventoEstatico => {
                        const jaExiste = dados.some(e => (e.nome || e.evento) === eventoEstatico.nome);
                        if (!jaExiste) {
                            dados.push(eventoEstatico);
                        }
                    });

                    renderizarProgramacao(dados);
                } else {
                    throw new Error('Servidor respondeu com erro');
                }
            } catch (erro) {
                console.error('Erro ao conectar ao Java:', erro);
                statusDot.classList.remove('online');
                statusText.innerText = 'Servidor Java Desconectado';
                
                // Exibe a lista completa de eventos estáticos offline
                renderizarProgramacao(eventosEstaticos);
            }
        }

        carregarProgramacao();
    </script>
</body>
</html>
