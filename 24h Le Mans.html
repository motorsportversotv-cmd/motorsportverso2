<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24h Le Mans</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a1128;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1c2541;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border-top: 5px solid #00b4d8;
        }

        h1 {
            color: #00b4d8;
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background-color: #00b4d8;
            color: #0a1128;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #90e0ef;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>24h Le Mans</h1>
        <p>A maior e mais tradicional corrida de resistência do mundo, onde pilotos e máquinas testam seus limites ao extremo por um dia inteiro.</p>
        <a href="#" class="btn">Ver Classificação</a>
    </div>

</body>
</html>
