<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal NASCAR - Velocidade em Preto e Amarelo</title>
    <style>
        /* Estilos de Fundo e Cores Base */
        body {
            font-family: 'Arial Black', sans-serif;
            margin: 0;
            background-color: #000000; /* Fundo Preto */
            color: #FFD700;           /* Texto Amarelo/Dourado */
        }

        /* Menu de Navegação */
        header {
            background-color: #FFD700; /* Fundo do Menu Amarelo */
            padding: 15px 0;
            border-bottom: 4px solid #333;
        }

        nav {
            display: flex;
            justify-content: center;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        li {
            position: relative;
            margin: 0 20px;
        }

        /* Links do Menu */
        a {
            text-decoration: none;
            color: #000000; /* Texto do link em Preto */
            font-weight: bold;
            text-transform: uppercase;
            padding: 10px 15px;
            display: block;
            transition: 0.3s ease;
        }

        a:hover {
            background-color: #000000; /* Inverte no hover */
            color: #FFD700;
        }

        /* Dropdown (Submenu de Categorias) */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #FFD700;
            min-width: 200px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            z-index: 1;
        }

        li:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            border-bottom: 1px solid #000;
            font-size: 0.9em;
        }

        /* Área de Conteúdo */
        main {
            padding: 60px 20px;
            text-align: center;
            max-width: 900px;
            margin: 40px auto;
            border: 3px solid #FFD700;
            border-radius: 15px;
        }

        h1 {
            font-size: 3.5em;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .btn-historia {
            display: inline-block;
            margin-top: 20px;
            background-color: #FFD700;
            color: #000;
            padding: 15px 30px;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<header>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li>
                <a href="#categorias">Categorias ▾</a>
                <div class="dropdown-content">
                    <a href="#cup">Cup Series</a>
                    <a href="#oreilly">O'Reilly Series</a>
                    <a href="#truck">Truck Series</a>
                    <a href="#brasil">NASCAR Brasil</a>
                    <div class="dropdown-content">
    <!-- Links para seções na mesma página (usam #) -->
    <a href="#cup">Cup Series</a>
    <a href="#oreilly">O'Reilly Series</a>
    <a href="#truck">Truck Series</a>
    
    <!-- Link para um novo arquivo HTML -->
    <a href="Nascar_Brasil.html">NASCAR Brasil</a>
</div>
                </div>
            </li>
            <li><a href="#historias">Histórias</a></li>
        </ul>
    </nav>
</header>

<main>
    <h1>NASCAR HUB</h1>
    <p>Explore a adrenalina da maior categoria de Stock Car do mundo.</p>
    <a href="#historias" class="btn-historia">Ver Histórias Lendárias</a>
</main>

</body>
</html>
