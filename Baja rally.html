<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Baja</title>
    <style>
        /* Estilo básico do menu */
        nav {
            background-color: #1a1a1a;
            padding: 1rem;
            font-family: Arial, sans-serif;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            transition: color 0.3s;
        }

        /* Efeito ao passar o mouse */
        li a:hover {
            color: #ffcc00;
        }

        /* Ajuste para celulares */
        @media (max-width: 600px) {
            ul {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="#">Fia Baja Cup</a></li>
            <li><a href="#">BR BAJA UTVS</a></li>
            <li><a href="#">Baja 1000</a></li>
            <li><a href="#">UTV CUP</a></li>
        </ul>
    </nav>

</body>
</html>
