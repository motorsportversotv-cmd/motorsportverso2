    <style>
        body {
            margin: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px; /* Reduzido para ajustar o layout vertical */
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column; /* Alinha os blocos de cima para baixo */
            align-items: center;    /* Centraliza os blocos horizontalmente */
            gap: 32px;              /* Espaço entre o título e os dados abaixo */
        }

        /* Seção do Título (Acima) */
        .secao-titulo {
            text-align: center;
            width: 100%;
        }

        .titulo {
            font-family: 'Arial Black', Impact, sans-serif;
            color: #000000;
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 8px 0;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .subtitulo {
            color: #555555;
            font-size: 1rem;
            font-style: italic;
            margin: 0;
        }

        /* Seção do Placar e Créditos (Abaixo) */
        .secao-dados {
            width: 100%;
            max-width: 350px; /* Mantém a lista compacta e alinhada à esquerda internamente */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .placar {
            color: #000000;
        }

        .placar-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 2px;
        }

        .placar-sub {
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .lista-posicoes {
            list-style: none;
            padding: 0;
            margin: 0;
            font-weight: bold;
            font-size: 1rem;
            line-height: 1.6;
        }

        .creditos {
            color: #000000;
            font-weight: bold;
            font-size: 0.85rem;
            border-top: 1px solid #eeeeee; /* Linha sutil para separar dos dados */
            padding-top: 15px;
        }
    </style>
</head>
