<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Inscritos Rally</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 10px; }
        .campo { margin-bottom: 10px; }
        label { display: inline-block; width: 150px; font-weight: bold; }
        input, select { padding: 5px; width: 250px; }
        button { padding: 8px 15px; margin-top: 10px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Cadastro do Rally</h2>
    <form id="formRally">
        <div class="campo"><label>Número:</label><input type="number" id="num" required></div>
        <div class="campo"><label>Piloto:</label><input type="text" id="piloto" required></div>
        <div class="campo"><label>Navegador:</label><input type="text" id="navegador" required></div>
        <div class="campo"><label>Equipe:</label><input type="text" id="equipe" required></div>
        <div class="campo"><label>Veículo:</label><input type="text" id="veiculo" required></div>
        <div class="campo"><label>Campeonato:</label><input type="text" id="campeonato" required></div>
        <div class="campo">
            <label>Categoria:</label>
            <select id="categoria" required>
                <option value="BR Rally 2">BR Rally 2</option>
                <option value="BR Rally 4">BR Rally 4</option>
                <option value="BR Rally 5">BR Rally 5</option>
                <option value="Gaucho Rally 2">Gaucho Rally 2</option>
                <option value="Gaucho Rally 4">Gaucho Rally 4</option>
                <option value="Gaucho Rally 5">Gaucho Rally 5</option>
                <option value="RallyPR 4x4">RallyPR 4x4</option>
            </select>
        </div>
        <button type="submit">Salvar Competidor</button>
    </form>

    <h2>Lista de Inscritos</h2>
    <table>
        <thead>
            <tr>
                <th>N°</th>
                <th>Piloto</th>
                <th>Navegador</th>
                <th>Equipe</th>
                <th>Veículo</th>
                <th>Campeonato</th>
                <th>Categoria</th>
            </tr>
        </thead>
        <tbody id="tabela"></tbody>
    </table>

<script>
    // Carrega a tabela assim que abre a página usando o código HTML que já estava salvo
    document.getElementById("tabela").innerHTML = localStorage.getItem("tabela_rally") || "";

    // Quando clica em Salvar Competidor
    document.getElementById("formRally").addEventListener("submit", function(e) {
        e.preventDefault(); // Impede a página de atualizar

        // Pega os textos digitados
        let num = document.getElementById("num").value;
        let piloto = document.getElementById("piloto").value;
        let navegador = document.getElementById("navegador").value;
        let equipe = document.getElementById('equipe').value;
        let veiculo = document.getElementById("veiculo").value;
        let campeonato = document.getElementById("campeonato").value;
        let categoria = document.getElementById("categoria").value;

        // Cria a linha de texto HTML pura da tabela
        let novaLinha = `<tr>
            <td><b>${num}</b></td>
            <td>${piloto}</td>
            <td>${navegador}</td>
            <td>${equipe}</td>
            <td>${veiculo}</td>
            <td>${campeonato}</td>
            <td><b>${categoria}</b></td>
        </tr>`;

        // Adiciona a nova linha no fim do elemento tabela
        document.getElementById("tabela").innerHTML += novaLinha;

        // Guarda o código HTML inteiro da tabela no navegador
        localStorage.setItem("tabela_rally", document.getElementById("tabela").innerHTML);

       
    });
</script>

</body>
</html>
