<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally de Nova Itália - Filtro de Inscritos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 30px;
            background-color: #f4f6f9;
            color: #333;
        }
        h2 {
            color: #1a1a1a;
            border-bottom: 2px solid #e65c00;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
        /* Estilo do painel de contadores rápidos */
        .painel-numeros {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .card-numero {
            background: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card-numero.total {
            background: #e65c00;
        }
        .card-numero h3 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }
        .card-numero p {
            margin: 5px 0 0 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }
        .seletor-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 16px;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            background-color: #fff;
            cursor: pointer;
        }
        select:focus {
            outline: none;
            border-color: #e65c00;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        tr {
            border-bottom: 1px solid #eee;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        tr:last-child {
            border-bottom: 2px solid #2c3e50;
        }
        .hidden {
            display: none !important;
        }
        .no-results {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <h2>Rally de Nova Itália - Estatísticas e Inscritos</h2>

    <!-- NOVO COMPONENTE: Painel de Contagem Dinâmica -->
    <div class="painel-numeros">
        <div class="card-numero total">
            <h3 id="num-total">0</h3>
            <p>Total Exibido</p>
        </div>

        <div class="card-numero">

        </select>
    </div>

   
    <div id="msg-no-results" class="no-results">Nenhum inscrito encontrado para o filtro selecionado.</div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const selectorFiltro = document.getElementById("escolha_categoria");
        const tabela = document.getElementById("tabelaRally");
        const msgNoResults = document.getElementById("msg-no-results");

        function calcularEstatisticas() {
            const linhas = tabela.querySelectorAll("tbody tr");
            let totalAtivo = 0;
            let totalBR = 0;
            let totalGaucho = 0;
            let totalPR = 0;

            const contagemCategorias = {};
            const contagemMarcas = {};
            const contagemModelos = {};
            const categoriaSelecionada = selectorFiltro.value;

            linhas.forEach(linha => {
                // Captura os valores das colunas de categoria (BR=4, Gaúcho=5, PR=6)
                const txtModeloCompleto = linha.cells[3]?.textContent.trim() || "";
                const catBR = linha.cells[4]?.textContent.trim() || "";
                const catGaucho = linha.cells[5]?.textContent.trim() || "";
                const catPR = linha.cells[6]?.textContent.trim() || "";

                // Verifica se a linha possui correspondência com o filtro em QUALQUER uma das 3 colunas de categoria
                const correspondeFiltro = (categoriaSelecionada === "TODAS" || 
                                           catBR === categoriaSelecionada || 
                                           catGaucho === categoriaSelecionada || 
                                           catPR === categoriaSelecionada);

                if (correspondeFiltro) {
                    linha.style.display = "";
                    totalAtivo++;

                    // Conta totais gerais por campeonato (ignora traços ou campos vazios)
                    if (catBR && catBR !== "-") totalBR++;
Use o código com cuidado.
if (catGaucho && catGaucho !== "-") totalGaucho++;
if (catPR && catPR !== "-") totalPR++;
// Contabiliza categorias ativas na filtragem atual
[catBR, catGaucho, catPR].forEach(cat => {
if (cat && cat !== "-") {
contagemCategorias[cat] = (contagemCategorias[cat] || 0) + 1;
}
});
// Processa Marcas (Primeira palavra do Modelo)
if (txtModeloCompleto) {
const marca = txtModeloCompleto.split(' ')[0];
if (marca) {
contagemMarcas[marca] = (contagemMarcas[marca] || 0) + 1;
}
// Processa Modelos
contagemModelos[txtModeloCompleto] = (contagemModelos[txtModeloCompleto] || 0) + 1;
}
} else {
linha.style.display = "none";
}
});
// Atualiza os contadores do painel superior topo
document.getElementById("num-total").innerText = totalAtivo;
document.getElementById("num-bra").innerText = totalBR;
document.getElementById("num-gaucho").innerText = totalGaucho;
document.getElementById("num-pr").innerText = totalPR;
// Atualiza o card de total das estatísticas de baixo
document.getElementById("total-inscritos").innerText = totalAtivo;
// Exibe mensagem caso nenhum resultado seja retornado
msgNoResults.style.display = totalAtivo === 0 ? "block" : "none";
// Renderiza as listas analíticas
renderLista("lista-categorias", contagemCategorias);
renderLista("lista-marcas", contagemMarcas);
renderLista("lista-modelos", contagemModelos);
}
// Função auxiliar para renderizar listas de estatísticas ordenadas por quantidade decrescente
function renderLista(idElemento, objetoDados) {
const elemento = document.getElementById(idElemento);
elemento.innerHTML = "";
const itensOrdenados = Object.entries(objetoDados).sort((a, b) => b[1] - a[1]);
for (const [chave, qtd] of itensOrdenados) {
elemento.innerHTML += <li><span>${chave}</span><span class="count-val">${qtd}</span></li>;
}
}
selectorFiltro.addEventListener("change", calcularEstatisticas);
calcularEstatisticas(); // Execução inicial
});
