<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Inscritos Rally</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 950px; margin: 20px auto; padding: 10px; }
        .topo { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        .link-admin { color: #0066cc; cursor: pointer; text-decoration: underline; font-size: 14px; font-weight: bold; }
        #areaCadastro { background-color: #f9f9f9; padding: 20px; border: 1px dashed #999; border-radius: 5px; margin-bottom: 30px; display: none; }
        .campo { margin-bottom: 10px; }
        label { display: inline-block; width: 150px; font-weight: bold; }
        input, select { padding: 5px; width: 250px; }
        button { padding: 8px 15px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .coluna-acao { display: none; text-align: center; }
        .btn-excluir { background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .btn-excluir:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <div class="topo">
        <h2>Lista de Inscritos - Rally Nova Itália</h2>
        <span id="linkAdmin" class="link-admin" onclick="fazerLogin()">Entrar como Admin</span>
        <span id="linkSair" class="link-admin" onclick="fazerSair()" style="display: none; color: red;">Sair do Painel</span>
    </div>

    <div id="areaCadastro">
        <h3>Painel de Cadastro (Modo Administrador)</h3>
        <form id="formRally">
            <div class="campo"><label>Número:</label><input type="number" id="num" required></div>
            <div class="campo"><label>Piloto:</label><input type="text" id="piloto" required></div>
            <div class="campo"><label>Navegador:</label><input type="text" id="navegador" required></div>
            <div class="campo"><label>Equipe:</label><input type="text" id="equipe" required></div>
            <div class="campo"><label>Veículo:</label><input type="text" id="veiculo" required></div>
            <div class="campo"><label>Campeonato:</label><input type="text" id="campeonato" required></div>
            <div class="campo">
                <label>Categoria:</label>
                <select id="categoria" required>
                    <option value="BR Rally 2">BR Rally 2</option>
                    <option value="BR Rally 4">BR Rally 4</option>
                    <option value="BR Rally 5">BR Rally 5</option>
                    <option value="BR Rally 5 L">BR Rally 5 L</option>
                    <option value="Gaucho Rally 2">Gaucho Rally 2</option>
                    <option value="Gaucho Rally 4">Gaucho Rally 4</option>
                    <option value="Gaucho Rally 5">Gaucho Rally 5</option>
                    <option value="Gaucho Rally 5 L">Gaucho Rally 5 L</option>
                    <option value="Gaucho UTV SSV">Gaucho UTV SSV</option>
                    <option value="RallyPR 4x4">RallyPR 4x4</option>
                    <option value="RallyPR 4x2 Fia">RallyPR 4x2 Fia</option>
                    <option value="RallyPR 4x2 Pró">RallyPR 4x2 Pró</option>
                    <option value="RallyPR 4x2 Super">RallyPR 4x2 Super</option>
                    <option value="RallyPR RCC">RallyPR RCC</option>
                    <option value="RallyPR RTT">RallyPR RTT</option>
                </select>
            </div>
            <button type="submit" style="background-color: #ccffcc;">Salvar Competidor</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>N°</th>
                <th>Piloto</th>
                <th>Navegador</th>
                <th>Equipe</th>
                <th>Veículo</th>
                <th>Campeonato</th>
                <th>Categoria</th>
                <th class="coluna-acao" id="thAcao">Ações</th>
            </tr>
        </thead>
        <tbody id="tabela"></tbody>
    </table>

<script>
    // Carrega o banco estruturado ou inicia um vazio para gerenciar as linhas individualmente
    let dadosSalvos = JSON.parse(localStorage.getItem("dados_rally_estruturados")) || [];
    let modoAdminAtivo = false;

    const SENHA_CORRETA = "Rally2026!";

    // Desenha a tabela dinamicamente com base nos dados salvos
    function atualizarInterfaceTabela() {
        const corpoTabela = document.getElementById("tabela");
        corpoTabela.innerHTML = "";

        dadosSalvos.forEach((competidor, indice) => {
            let linha = document.createElement("tr");
            linha.innerHTML = `
                <td><b>${competidor.num}</b></td>
                <td>${competidor.piloto}</td>
                <td>${competidor.navegador}</td>
                <td>${competidor.equipe}</td>
                <td>${competidor.veiculo}</td>
                <td>${competidor.campeonato}</td>
                <td><b>${competidor.categoria}</b></td>
                <td class="coluna-acao" style="display: ${modoAdminAtivo ? 'table-cell' : 'none'}">
                    <button class="btn-excluir" onclick="removerLinha(${indice})">Excluir</button>
                </td>
            `;
            corpoTabela.appendChild(linha);
        });

        // Controla a exibição do cabeçalho da coluna de ações
        document.getElementById("thAcao").style.display = modoAdminAtivo ? "table-cell" : "none";
    }

    function fazerLogin() {
        let senhaDigitada = prompt("Digite a senha de administrador para liberar ações:");
        if (senhaDigitada === SENHA_CORRETA) {
            modoAdminAtivo = true;
            document.getElementById("areaCadastro").style.display = "block";
            document.getElementById("linkAdmin").style.display = "none";
            document.getElementById("linkSair").style.display = "inline";
            atualizarInterfaceTabela();
        } else if (senhaDigitada !== null) {
            alert("Senha incorreta!");
        }
    }

    function fazerSair() {
        modoAdminAtivo = false;
        document.getElementById("areaCadastro").style.display = "none";
        document.getElementById("linkAdmin").style.display = "inline";
        document.getElementById("linkSair").style.display = "none";
        atualizarInterfaceTabela();
    }

    // Função para remover uma linha específica
    function removerLinha(indice) {
        if (confirm("Deseja mesmo remover este competidor?")) {
            dadosSalvos.splice(indice, 1); // Remove do array
            localStorage.setItem("dados_rally_estruturados", JSON.stringify(dadosSalvos)); // Salva nova lista
            atualizarInterfaceTabela(); // Redesenha a tela
        }
    }

    // Grava um novo competidor estruturado
    document.getElementById("formRally").addEventListener("submit", function(e) {
        e.preventDefault();

        let novoCompetidor = {
            num: document.getElementById("num").value,
            piloto: document.getElementById("piloto").value,
            navegador: document.getElementById("navegador").value,
            equipe: document.getElementById('equipe').value,
            veiculo: document.getElementById("veiculo").value,
            campeonato: document.getElementById("campeonato").value,
            categoria: document.getElementById("categoria").value
        };

        dadosSalvos.push(novoCompetidor);
        localStorage.setItem("dados_rally_estruturados", JSON.stringify(dadosSalvos));
        
        atualizarInterfaceTabela();
        document.getElementById("formRally").reset();
    });

    // Inicia carregando os dados na tela
    atualizarInterfaceTabela();
</script>

</body>
</html>
