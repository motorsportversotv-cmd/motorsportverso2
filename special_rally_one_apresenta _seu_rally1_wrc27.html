<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Rally One apresenta seu novo Rally 1 para o WRC 27</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Special Rally One apresenta seu novo Rally 1 para o WRC 27</h1>
        <p>A equipe Belga Special Rally One apresentou o seu rally 1 com bolha de seu tuner inspirada 
        no Porsche Macan  que usa motor baseado no rally 2 do Skoda.

        </p>
        <button onclick="clicou()">Clique Aqui</button>
    </div>

    <script>
        function clicou() {
            alert('Você clicou no botão!');
        }
    </script>

</body>
</html>
