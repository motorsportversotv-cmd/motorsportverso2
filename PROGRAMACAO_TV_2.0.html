<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação de Corridas do Final de Semana</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #e50914;
            margin-bottom: 20px;
        }
        /* Estilo da Guia/Barra de Pesquisa */
        .busca-container {
            margin-bottom: 25px;
            text-align: center;
        }
        .input-busca {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-busca:focus {
            border-color: #e50914;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 100px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #222;
            color: white;
            text-transform: uppercase;
            font-size: 14px;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .btn-assistir {
            display: inline-block;
            padding: 6px 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-assistir:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏁 Programação de Corridas do Final de Semana</h1>
    
    <!-- GUIA DE PESQUISA ADICIONADA -->
    <div class="busca-container">
        <input 
            type="text" 
            id="campoBusca" 
            class="input-busca" 
            placeholder="Pesquise por categoria ou pista... (ex: MotoGP, EUA)"
            onkeyup="filtrarCorridas()"
        >
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Categoria</th>
                <th>Sessão</th>
                <th>Pista / Local</th>
                <th>Data</th>
                <th>Horário (BRT)</th>
                <th>Transmissão</th>
            </tr>
        </thead>
        <tbody id="tabela-corridas">
            <!-- Inserção via JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // Dados do banco simulado
    const dadosCorridas = [
        {
            "categoria": "MotoGP",
            "sessao": "Corrida Sprint",
            "pista": "Mugello (Itália)",
            "data": "30/05/2026",
            "horario": "10:00",
            "onde_assistir": "ESPN 4 / Disney+",
            "link": "https://disneyplus.com"
        },
        {
            "categoria": "MotoGP",
            "sessao": "Corrida Principal",
            "pista": "Mugello (Itália)",
            "data": "31/05/2026",
            "horario": "09:00",
            "onde_assistir": "ESPN 4 / Disney+",
            "link": "https://disneyplus.com"
        },
        {
            "categoria": "NASCAR Cup Series",
            "sessao": "Corrida",
            "pista": "Nashville (EUA)",
            "data": "31/05/2026",
            "horario": "20:00",
            "onde_assistir": "Disney+",
            "link": "https://disneyplus.com"
        },
        {
            "categoria": "IMSA SportsCar",
            "sessao": "Corrida",
            "pista": "Detroit (EUA)",
            "data": "30/05/2026",
            "horario": "17:00",
            "onde_assistir": "YouTube Grande Prêmio",
            "link": "https://youtube.com"
        },
        {
            "categoria": "GT World Challenge Europe",
            "sessao": "Corrida",
            "pista": "Monza (Itália)",
            "data": "31/05/2026",
            "horario": "10:30",
            "onde_assistir": "YouTube GTWorld",
            "link": "https://youtube.com"
        }
    ];

    // Renderiza a lista na tabela
    function carregarTabela(lista) {
        const corpoTabela = document.getElementById('tabela-corridas');
        corpoTabela.innerHTML = ''; 

        lista.forEach(corrida => {
            const linha = document.createElement('tr');
            linha.innerHTML = `
                <td><strong>${corrida.categoria}</strong></td>
                <td>${corrida.sessao}</td>
                <td>${corrida.pista}</td>
                <td>${corrida.data}</td>
                <td>${corrida.horario}</td>
                <td>
                    <a href="${corrida.link}" target="_blank" class="btn-assistir">
                        ${corrida.onde_assistir}
                    </a>
                </td>
            `;
            corpoTabela.appendChild(linha);
        });
    }

    // FUNÇÃO DE FILTRO DA GUIA DE PESQUISA
    function filtrarCorridas() {
        // Pega o texto digitado e transforma em letras minúsculas
        const termoBusca = document.getElementById('campoBusca').value.toLowerCase();
        
        // Filtra o array de dados comparando com Categoria ou Pista
        const dadosFiltrados = dadosCorridas.filter(corrida => {
            return corrida.categoria.toLowerCase().includes(termoBusca) || 
                   corrida.pista.toLowerCase().includes(termoBusca);
        });

        // Recarrega a tabela apenas com as corridas encontradas
        carregarTabela(dadosFiltrados);
    }

    // Inicializa a página com todos os dados
    window.onload = () => carregarTabela(dadosCorridas);
</script>

</body>
</html>
