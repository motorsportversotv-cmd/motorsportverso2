<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação de Corridas do Final de Semana</title>
    <style>
        /* Estilos básicos para deixar a página bonita e responsiva */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #e50914; /* Vermelho automobilismo */
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #222;
            color: white;
            text-transform: uppercase;
            font-size: 14px;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .btn-assistir {
            display: inline-block;
            padding: 6px 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-assistir:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏁 Programação de Corridas do Final de Semana</h1>
    
    <table>
        <thead>
            <tr>
                <th>Categoria</th>
                <th>Sessão</th>
                <th>Pista / Local</th>
                <th>Data</th>
                <th>Horário (BRT)</th>
                <th>Transmissão</th>
            </tr>
        </thead>
        <tbody id="tabela-corridas">
            <!-- Os dados do JavaScript serão inseridos aqui automaticamente -->
        </tbody>
    </table>
</div>

<script>
    // 1. Simulando a leitura do nosso Banco de Dados JSON criado no passo anterior
    const dadosCorridas = [
        {
            "categoria": "MotoGP",
            "sessao": "Corrida Sprint",
            "pista": "Mugello (Itália)",
            "data": "30/05/2026",
            "horario": "10:00",
            "onde_assistir": "ESPN 4 / Disney+",
            "link": "https://disneyplus.com"
        },
        {
            "categoria": "MotoGP",
            "sessao": "Corrida Principal",
            "pista": "Mugello (Itália)",
            "data": "31/05/2026",
            "horario": "09:00",
            "onde_assistir": "ESPN 4 / Disney+",
            "link": "https://disneyplus.com"
        },
        {
            "categoria": "NASCAR Cup Series",
            "sessao": "Corrida",
            "pista": "Nashville (EUA)",
            "data": "31/05/2026",
            "horario": "20:00",
            "onde_assistir": "Disney+",
            "link": "https://disneyplus.com"
        },
        {
            "categoria": "IMSA SportsCar",
            "sessao": "Corrida",
            "pista": "Detroit (EUA)",
            "data": "30/05/2026",
            "horario": "17:00",
            "onde_assistir": "YouTube Grande Prêmio",
            "link": "https://youtube.com"
        },
        {
            "categoria": "GT World Challenge Europe",
            "sessao": "Corrida",
            "pista": "Monza (Itália)",
            "data": "31/05/2026",
            "horario": "10:30",
            "onde_assistir": "YouTube GTWorld",
            "link": "https://youtube.com"
        }
    ];

    // 2. Função JavaScript que lê a lista e monta as linhas da tabela HTML
    function carregarTabela() {
        const corpoTabela = document.getElementById('tabela-corridas');
        corpoTabela.innerHTML = ''; // Limpa a tabela antes de carregar

        dadosCorridas.forEach(corrida => {
            // Cria uma nova linha no HTML
            const linha = document.createElement('tr');

            // Insere as colunas com as propriedades do objeto JSON
            linha.innerHTML = `
                <td><strong>${corrida.categoria}</strong></td>
                <td>${corrida.sessao}</td>
                <td>${corrida.pista}</td>
                <td>${corrida.data}</td>
                <td>${corrida.horario}</td>
                <td>
                    <a href="${corrida.link}" target="_blank" class="btn-assistir">
                        ${corrida.onde_assistir}
                    </a>
                </td>
            `;

            // Adiciona a linha preenchida dentro do corpo da tabela
            corpoTabela.appendChild(linha);
        });
    }

    // Executa a função assim que a página carrega
    window.onload = carregarTabela;
</script>

</body>
</html>
