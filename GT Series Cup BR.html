<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT Series Cup BR</title>
    <style>
        /* RESET BÁSICO */
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f4; }

        /* 1. MENU SUPERIOR (CINZA E VERDE) */
        nav {
            background-color: #2b2b2b; /* Cinza Escuro */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            height: 70px;
            border-bottom: 3px solid #2ecc71; /* Linha Verde inferior */
        }
        
        .logo-site {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .menu-links {
            display: flex;
            height: 100%;
        }

        nav a {
            color: #2ecc71; /* Verde */
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background-color: #3d3d3d;
            color: #fff;
        }

        /* 2. BARRA DE NOTÍCIAS (LETREIRO) */
        .breaking-news {
            background: #1a1a1a;
            color: #fff;
            padding: 12px 0;
            overflow: hidden;
            white-space: nowrap;
            font-size: 14px;
        }
        .breaking-news-content {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 25s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
        .news-tag {
            background: #2ecc71;
            color: #000;
            padding: 3px 10px;
            font-weight: bold;
            margin-right: 15px;
            border-radius: 2px;
            text-transform: uppercase;
        }







<!-- Adicione este CSS dentro da sua tag <style> -->
<style>
    /* ... seus estilos anteriores ... */

    /* 4. BARRA DE CATEGORIAS */
    .categorias-container {
        background-color: #fff;
        padding: 20px 0;
        border-bottom: 1px solid #ddd;
    }

    .categorias-grid {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    .categoria-item {
        background-color: #2b2b2b;
        color: #2ecc71;
        padding: 15px 25px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 120px;
        transition: all 0.3s ease;
        border: 2px solid transparent;
    }

    .categoria-item:hover {
        background-color: #2ecc71;
        color: #2b2b2b;
        transform: translateY(-5px);
        border-color: #2b2b2b;
    }

    .categoria-icon {
        font-size: 20px;
        margin-bottom: 5px;
    }
</style>
