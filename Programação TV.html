<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Cadastro e Controle - Administrador</title>
    <style>
        /* ESTILOS GERAIS */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .panel-cadastro, .panel-lista {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        h3 {
            color: #34495e;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .cadastro-secao {
            background: #fafafa;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-primary {
            background-color: #3498db;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        /* TABELA DE EVENTOS ALINHADA E CORRIGIDA */
        .tabela-container {
            width: 100%;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
        }

        .badge-principal {
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        .btn-deletar {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-deletar:hover {
            background-color: #c0392b;
        }

        .sem-dados {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
            font-style: italic;
        }

        /* REGRAS DE ADAPTAÇÃO PARA CELULAR (CARDS EMPILHADOS) */
        @media screen and (max-width: 650px) {
            body { padding: 10px; }
            .panel-cadastro, .panel-lista { padding: 15px; }

            table thead { display: none; } /* Esconde o cabeçalho no celular */

            table, table tbody, table tr, table td {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }

            table tr {
                background: #fafafa;
                border: 1px solid #e0e0e0;
                border-radius: 6px;
                margin-bottom: 15px;
                padding: 10px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            }

            table td {
                text-align: right;
                padding: 8px 10px;
                border-bottom: 1px dashed #eee;
                position: relative;
                font-size: 13px;
            }

            table td:last-child {
                border-bottom: none;
                text-align: center;
                padding-top: 12px;
            }

            /* Exibe o nome da coluna à esquerda no celular */
            table td::before {
                content: attr(data-label);
                position: absolute;
                left: 10px;
                width: 45%;
                text-align: left;
                font-weight: bold;
                color: #7f8c8d;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- PAINEL DE CADASTRO -->
        <main class="panel-cadastro">
            <h2>Painel de Cadastro (Modo Administrador)</h2>

            <section class="cadastro-secao">
                <h3>Cadastro - Canal Principal</h3>
                <form id="cadastro-tv-form-1" onsubmit="salvarEvento(event)">
                    <div class="form-group">
                        <label for="prog-data-1">Data:</label>
                        <input type="date" id="prog-data-1" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-hora-1">Hora:</label>
                        <input type="time" id="prog-hora-1" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-descricao-1">Descrição categoria\evento:</label>
                        <input type="text" id="prog-descricao-1" placeholder="Ex: Fia WEC - FP3" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-local-1">Local:</label>
                        <input type="text" id="prog-local-1" placeholder="Ex: Fuji" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-canal-1">Canal:</label>
                        <select id="prog-canal-1" required>
                            <option value="Bandsports">Bandsports</option>
                            <option value="Youtube">Youtube</option>
                            <option value="Globo">Globo</option>
                            <option value="ESPN">ESPN</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prog-desc-canal-1">Descrição do Canal:</label>
                        <input type="text" id="prog-desc-canal-1" placeholder="Ex: Grande Premio">
                    </div>
                    
                    <button type="submit" class="btn-submit btn-primary">Salvar Programação</button>
                </form>
            </section>
        </main>

        <!-- PAINEL DA TABELA (ESTRUTURA FIXA NO HTML) -->
        <section class="panel-lista">
            <h3>Programações Cadastradas</h3>
            <div class="tabela-container">
                <table id="minha-tabela">
                    <thead>
                        <tr>
                            <th>Data/Hora</th>
                            <th>Evento/Local</th>
                            <th>Tipo</th>
                            <th>Canal / Info</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela">
                        <!-- O JavaScript vai colocar as linhas EXATAMENTE aqui dentro -->
                        <tr>
                            <td colspan="5" class="sem-dados">Nenhum evento cadastrado ainda.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // Memória para guardar os eventos cadastrados provisoriamente
        let eventosSalvos = [];

        function salvarEvento(event) {
            event.preventDefault(); // Impede o reload da página

            // Pega as informações digitadas
            const dataInput = document.getElementById('prog-data-1').value;
            const hora = document.getElementById('prog-hora-1').value;
            const descricao = document.getElementById('prog-descricao-1').value;
            const local = document.getElementById('prog-local-1').value;
            const canal = document.getElementById('prog-canal-1').value;
            const descCanal = document.getElementById('prog-desc-canal-1').value;

            // Transforma a data americana (AAAA-MM-DD) para padrão brasileiro (DD/MM/AAAA)
            const dataBR = dataInput.split('-').reverse().join('/');

            // Cria o registro
            const novoItem = {
                dataHora: `${dataBR} - ${hora}`,
                eventoLocal: `<strong>${descricao}</strong><br>📍 ${local}`,
                tipo: '<span class="badge badge-principal">PRINCIPAL</span>',
                canalInfo: `${canal}<br>📺 ${descCanal || 'Geral'}`
            };

            // Guarda na lista
            eventosSalvos.push(novoItem);

            // Atualiza as linhas da tabela
            atualizarTabelaNaTela();

            // Limpa o formulário
            document.getElementById('cadastro-tv-form-1').reset();
        }
// Localize no seu arquivo a função que pega os dados salvos e joga na tela.
// Ela deve ser parecida com esta estrutura abaixo:
function renderizarListaDeEventos(eventos) {
    // 1. Captura o corpo da tabela onde as linhas devem entrar
    const tbody = document.getElementById('corpo-tabela'); 
    
    // Se não houver dados salvos
    if (!eventos || eventos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="sem-dados">Nenhum evento cadastrado.</td></tr>';
        return;
    }

    let linhasHtml = "";

    // 2. O segredo está aqui: gerar as tags <tr> e <td> com o "data-label" para o celular
    eventos.forEach((evento, index) => {
        // Define se o selo é azul (principal) ou verde (alternativo) baseado no parâmetro passado
        const badgeClasse = evento.tipo === 1 || evento.tipo === 'PRINCIPAL' ? 'badge-principal' : 'badge-alternativo';
        const badgeTexto = evento.tipo === 1 || evento.tipo === 'PRINCIPAL' ? 'PRINCIPAL' : 'ALTERNATIVO';

        // Monta a linha com a estrutura perfeita da tabela
        linhasHtml += `
            <tr>
                <td data-label="Data/Hora">${evento.data} - ${evento.hora}</td>
                <td data-label="Evento/Local">
                    <strong>${evento.descricao}</strong><br>
                    📍 ${evento.local}
                </td>
                <td data-label="Tipo">
                    <span class="badge ${badgeClasse}">${badgeTexto}</span>
                </td>
                <td data-label="Canal / Info">
                    ${evento.canal}<br>
                    📺 ${evento.descCanal || 'Geral'}
                </td>
                <td data-label="Ações">
                    <!-- Certifique-se de ajustar a sua função de deletar aqui se necessário -->
                    <button class="btn-deletar" onclick="excluirEvento('${evento.id}' || ${index})">Excluir</button>
                </td>
            </tr>
        `;
    });

    // 3. Injeta as linhas estruturadas dentro do <tbody> correto do HTML
    tbody.innerHTML = linhasHtml;
}

<section class="panel-lista">
    <h3>Programações Cadastradas</h3>
    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>Evento/Local</th>
                    <th>Tipo</th>
                    <th>Canal / Info</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <!-- O JavaScript vai injetar as linhas estritamente aqui dentro -->
            <tbody id="corpo-tabela"></tbody> 
        </table>
    </div>
</section>
