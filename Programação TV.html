
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; }
        #meuInput { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f6f8fa; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

    <!-- Campo de Busca -->
    <input type="text" id="meuInput" onkeyup="filtrarTabela()" placeholder="Pesquise por programa, canal, local...">

    <table id="minhaTabela">
        <thead>
            <tr>
                <th>Dia</th>
                <th>Hora</th>
                <th>Programa</th>
                <th>Local</th>
                <th>Canal</th>
            </tr>
        </thead>
        <tbody>
           
            <tr><td>04/04</td><td>03:00</td><td>GTWC Asia-Race 1</td><td>Sepang</td><td>Youtube/Youtube GP</td></tr>
            <tr><td>04/04</td><td>08:00</td><td>British Truck</td><td>Brands Hatch</td><td>Youtube/Youtube High Speed TV</td></tr>
            <tr><td>04/04</td><td>09:30</td><td>British Pick Up Racing</td><td>Brands Hatch</td><td>Youtube</td></tr>
            <tr><td>06/04</td><td>06:20</td><td>5 Nations Rallycross-etapa 2</td><td>Lyden Hill</td><td>Youtube</td></tr>
            
            <P>Atualizado em 22\03 as  15:12</P>
            
        </tbody>
    </table>

    <script>
    function filtrarTabela() {
        const input = document.getElementById("meuInput");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("minhaTabela");
        const tr = table.getElementsByTagName("tr");

        // Começa em 1 para pular o cabeçalho
        for (let i = 1; i < tr.length; i++) {
            let visible = false;
            const tds = tr[i].getElementsByTagName("td");
            
            // Percorre todas as colunas da linha atual
            for (let j = 0; j < tds.length; j++) {
                if (tds[j]) {
                    const txtValue = tds[j].textContent || tds[j].innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        visible = true;
                        break; // Se achou em uma coluna, não precisa olhar as outras
                    }
                }
            }
            tr[i].style.display = visible ? "" : "none";
        }
    }
    </script>

</body>
</html>
