<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        /* Estilo da Barra de Notícias */
        .news-ticker {
            background: #222;
            color: #fff;
            padding: 10px 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 3px solid #e20613; /* Cor temática Rally */
        }

        .ticker-wrapper {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 30s linear infinite;
        }

        .ticker-item {
            display: inline-block;
            padding: 0 30px;
            font-size: 14px;
        }

        .ticker-item strong {
            color: #ffcc00;
            text-transform: uppercase;
        }

        /* Animação de movimento */
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Pausar ao passar o mouse */
        .news-ticker:hover .ticker-wrapper {
            animation-play-state: paused;
        }
    </style>
</head>
<body>

<table>
    <th>Dia</th>
    <th>Descrição</th>
    <th>local</th>
    <th>hora</th>
</table>
    </div>
</div>

</body>
</html>
