<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Programação TV & Streaming</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 20px auto; padding: 10px; }
        .topo { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        .link-admin { color: #0066cc; cursor: pointer; text-decoration: underline; font-size: 14px; font-weight: bold; }
        #areaCadastro { background-color: #f9f9f9; padding: 20px; border: 1px dashed #999; border-radius: 5px; margin-bottom: 30px; display: none; }
        .campo { margin-bottom: 10px; }
        label { display: inline-block; width: 150px; font-weight: bold; }
        input, select { padding: 5px; width: 280px; }
        button { padding: 8px 15px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .coluna-acao { display: none; text-align: center; }
        .btn-excluir { background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .btn-excluir:hover { background-color: #cc0000; }
        .btn-link { background-color: #0066cc; color: white; padding: 4px 8px; text-decoration: none; border-radius: 3px; font-size: 13px; display: inline-block; }
        .btn-link:hover { background-color: #004080; }
    </style>

    <!-- Módulos do Firebase SDK (v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // CONFIGURAÇÃO DO SEU FIREBASE:
        // Crie um projeto gratuito em https://console.firebase.google.com/ e cole os dados abaixo
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "123456789",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const programacaoRef = ref(db, "programacao");

        let modoAdminAtivo = false;
        const SENHA_CORRETA = "Rally2026!";

        // Escuta atualizações do banco em tempo real em qualquer dispositivo
        onValue(programacaoRef, (snapshot) => {
            const corpoTabela = document.getElementById("tabela");
            corpoTabela.innerHTML = "";

            if (snapshot.exists()) {
                const dados = snapshot.val();
                Object.keys(dados).forEach((idKey) => {
                    const item = dados[idKey];
                    let linha = document.createElement("tr");
                    linha.innerHTML = `
                        <td><b>${item.data}</b></td>
                        <td>${item.hora}</td>
                        <td>${item.descricao}</td>
                        <td>${item.canal}</td>
                        <td>${item.local}</td>
                        <td><b>${item.categoria}</b></td>
                        <td><a href="${item.links}" target="_blank" rel="noopener noreferrer" class="btn-link">Acessar</a></td>
                        <td class="coluna-acao" style="display: ${modoAdminAtivo ? 'table-cell' : 'none'}">
                            <button class="btn-excluir" data-id="${idKey}">Excluir</button>
                        </td>
                    `;
                    corpoTabela.appendChild(linha);
                });

                // Adiciona evento de remoção para os botões gerados
                document.querySelectorAll(".btn-excluir").forEach(btn => {
                    btn.addEventListener("click", function() {
                        const id = this.getAttribute("data-id");
                        removerLinha(id);
                    });
                });
            }

            atualizarVisibilidadeAcoes();
        });

        function atualizarVisibilidadeAcoes() {
            document.getElementById("thAcao").style.display = modoAdminAtivo ? "table-cell" : "none";
            document.querySelectorAll(".coluna-acao").forEach(el => {
                el.style.display = modoAdminAtivo ? "table-cell" : "none";
            });
        }

        window.fazerLogin = function() {
            let senhaDigitada = prompt("Digite a senha de administrador para liberar ações:");
            if (senhaDigitada === SENHA_CORRETA) {
                modoAdminAtivo = true;
                document.getElementById("areaCadastro").style.display = "block";
                document.getElementById("linkAdmin").style.display = "none";
                document.getElementById("linkSair").style.display = "inline";
                atualizarVisibilidadeAcoes();
            } else if (senhaDigitada !== null) {
                alert("Senha incorreta!");
            }

        };

        window.fazerSair = function() {
            modoAdminAtivo = false;
            document.getElementById("areaCadastro").style.display = "none";
            document.getElementById("linkAdmin").style.display = "inline";
            document.getElementById("linkSair").style.display = "none";
            atualizarVisibilidadeAcoes();
        };

        function removerLinha(id) {
            if (confirm("Deseja mesmo remover esta transmissão?")) {
                remove(ref(db, `programacao/${id}`));
            }
        }

        document.getElementById("formProgramacao").addEventListener("submit", function(e) {
            e.preventDefault();

            let novoEvento = {
                data: document.getElementById("data").value,
                hora: document.getElementById("hora").value,
                descricao: document.getElementById("descricao").value,
                canal: document.getElementById("canal").value,
                local: document.getElementById("local").value,
                links: document.getElementById("links").value,
                categoria: document.getElementById("categoria").value
            };

            push(programacaoRef, novoEvento);
            document.getElementById("formProgramacao").reset();
        });
    </script>
</head>
<body>

    <div class="topo">
        <h2>Programação de TV & Streaming</h2>
        <span id="linkAdmin" class="link-admin" onclick="fazerLogin()">Entrar como Admin</span>
        <span id="linkSair" class="link-admin" onclick="fazerSair()" style="display: none; color: red;">Sair do Painel</span>
    </div>

    <div id="areaCadastro">
        <h3>Painel de Cadastro de Eventos (Modo Administrador)</h3>
        <form id="formProgramacao">
            <div class="campo"><label>Data:</label><input type="text" id="data" placeholder="Ex: 25/09/2026" required></div>
            <div class="campo"><label>Hora:</label><input type="text" id="hora" placeholder="Ex: 21:30" required></div>
            <div class="campo"><label>Descrição:</label><input type="text" id="descricao" placeholder="Ex: FIA WEC - FP3" required></div>
            <div class="campo"><label>Canal / Transmissão:</label><input type="text" id="canal" placeholder="Ex: BandSports / YouTube" required></div>
            <div class="campo"><label>Local / Evento:</label><input type="text" id="local" placeholder="Ex: Fuji Speedway" required></div>
            <div class="campo"><label>Link do Streaming:</label><input type="url" id="links" placeholder="Ex: https://www.youtube.com/..." required></div>
            <div class="campo">
                <label>Plataforma / Categoria:</label>
                <select id="categoria" required>
                    <option value="Youtube">Youtube</option>
                    <option value="Twitch.TV">Twitch.TV</option>
                    <option value="ESPN">ESPN</option>
                    <option value="Sportv2 BR">Sportv2 BR</option>
                    <option value="Sportv3 BR">Sportv3 BR</option>
                    <option value="Racer BR">Racer BR</option>
                    <option value="Rally TV">Rally TV</option>
                    <option value="Gaucho Rally 5 L">Gaucho Rally 5 L</option>
                    <option value="Gaucho UTV SSV">Gaucho UTV SSV</option>
                    <option value="RallyPR 4x4">RallyPR 4x4</option>
                    <option value="RallyPR 4x2 Fia">RallyPR 4x2 Fia</option>
                    <option value="RallyPR 4x2 Pró">RallyPR 4x2 Pró</option>
                    <option value="RallyPR 4x2 Super">RallyPR 4x2 Super</option>
                    <option value="RallyPR RCC">RallyPR RCC</option>
                    <option value="RallyPR RTT">RallyPR RTT</option>
                </select>
            </div>
            <button type="submit" style="background-color: #ccffcc;">Salvar Transmissão</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Hora</th>
                <th>Descrição</th>
                <th>Canal</th>
                <th>Local</th>
                <th>Categoria</th>
                <th>Assistir</th>
                <th class="coluna-acao" id="thAcao">Ações</th>
            </tr>
        </thead>
        <tbody id="tabela"></tbody>
    </table>

</body>
</html>
