<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Cadastro e Controle - Administrador</title>
    <style>
        /* ESTILOS GERAIS */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .panel-cadastro, .panel-lista {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        h3 {
            color: #34495e;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .cadastro-secao {
            background: #fafafa;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-primary {
            background-color: #3498db;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #2ecc71;
        }

        .btn-secondary:hover {
            background-color: #27ae60;
        }

        /* ESTILOS DA LISTA DE EVENTOS */
        .tabela-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-principal {
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        .badge-alternativo {
            background-color: #e8f5e9;
            color: #1b5e20;
        }

        .btn-deletar {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-deletar:hover {
            background-color: #c0392b;
        }

        .sem-dados {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- PAINEL DE CADASTRO -->
        <main class="panel-cadastro">
            <h2>Painel de Cadastro (Modo Administrador)</h2>

            <!-- FORMULÁRIO 1: Canal Principal -->
            <section class="cadastro-secao">
                <h3>Cadastro - Canal Principal</h3>
                <form id="cadastro-tv-form-1" onsubmit="salvarEvento(event, 1)">
                    <div class="form-group">
                        <label for="prog-data-1">Data:</label>
                        <input type="date" id="prog-data-1" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-hora-1">Hora:</label>
                        <input type="time" id="prog-hora-1" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-descricao-1">Descrição categoria\evento:</label>
                        <input type="text" id="prog-descricao-1" placeholder="Ex: Rally Nova Itália - SS1 Shakedown" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-local-1">Local:</label>
                        <input type="text" id="prog-local-1" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-canal-1">Canal:</label>
                        <select id="prog-canal-1" required>
                            <option value="Bandsports">Bandsports</option>
                            <option value="Youtube">Youtube</option>
                            <option value="Globoplay Premium">Globoplay Premium</option>
                            <option value="Globo">Globo</option>
                            <option value="Fox Sports(USA)">Fox Sports(USA)</option>
                            <option value="Twitch .TV">Twitch .TV</option>
                            <option value="Roku.TV">Roku.TV</option>
                            <option value="Disney + (premium)">Disney + (premium)</option>
                            <option value="ESPN">ESPN</option>
                            <option value="Rally TV">Rally TV</option>
                            <option value="Sportv 2 (BR)">Sportv 2 (BR)</option>
                            <option value="Sportv 3 (BR)">Sportv 3 (BR)</option>
                            <option value="Sportv 4 Portugal">Sportv 4 Portugal</option>
                            <option value="Sportv 5 Portugal">Sportv 5 Portugal</option>
                            <option value="Racer BR">Racer BR</option>
                            <option value="Facebook">Facebook</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prog-desc-canal-1">Descrição do Canal (Ex: Youtube Canal):</label>
                        <input type="text" id="prog-desc-canal-1" placeholder="Ex: Transmissão Oficial, Língua Inglesa">
                    </div>
                    <div class="form-group">
                        <label for="prog-logo-cat-1">Colocar logo categoria (URL):</label>
                        <input type="url" id="prog-logo-cat-1" placeholder="https://link-da-imagem.com">
                    </div>
                    <div class="form-group">
                        <label for="prog-logo-canal-1">Colocar logo canal (URL):</label>
                        <input type="url" id="prog-logo-canal-1" placeholder="https://link-da-imagem.com">
                    </div>
                    <div class="form-group">
                        <label for="prog-links-transmissao-1">Colocar links de transmissão:</label>
                        <input type="url" id="prog-links-transmissao-1" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="prog-links-replay-1">Colocar links de replay:</label>
                        <input type="url" id="prog-links-replay-1" placeholder="https://...">
                    </div>
                    <button type="submit" class="btn-submit btn-primary">Salvar Programação Principal</button>
                </form>
            </section>

            <!-- FORMULÁRIO 2: Canal Alternativo / Secundário -->
            <section class="cadastro-secao">
                <h3>Cadastro - Canal Alternativo (Transmissão Secundária)</h3>
                <form id="cadastro-tv-form-2" onsubmit="salvarEvento(event, 2)">
                    <div class="form-group">
                        <label for="prog-data-2">Data:</label>
                        <input type="date" id="prog-data-2" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-hora-2">Hora:</label>
                        <input type="time" id="prog-hora-2" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-descricao-2">Descrição categoria\evento:</label>
                        <input type="text" id="prog-descricao-2" placeholder="Ex: Transmissão Alternativa / Onboard" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-local-2">Local:</label>
                        <input type="text" id="prog-local-2" required>
                    </div>
                    <div class="form-group">
                        <label for="prog-canal-2">Canal Alternativo:</label>
                        <select id="prog-canal-2" required>
                            <option value="Youtube">Youtube</option>
                            <option value="Twitch .TV">Twitch .TV</option>
                            <option value="Facebook">Facebook</option>
                            <option value="Bandsports">Bandsports</option>
                            <option value="Globoplay Premium">Globoplay Premium</option>
                            <option value="Globo">Globo</option>
                            <option value="Fox Sports(USA)">Fox Sports(USA)</option>
                            <option value="Roku.TV">Roku.TV</option>
                            <option value="Disney + (premium)">Disney + (premium)</option>
                            <option value="ESPN">ESPN</option>
                            <option value="Rally TV">Rally TV</option>
                            <option value="Sportv 2 (BR)">Sportv 2 (BR)</option>
                            <option value="Sportv 3 (BR)">Sportv 3 (BR)</option>
                            <option value="Sportv 4 Portugal">Sportv 4 Portugal</option>
                            <option value="Sportv 5 Portugal">Sportv 5 Portugal</option>
                            <option value="Racer BR">Racer BR</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prog-desc-canal-2">Descrição do Canal Alternativo (Ex: Twitch TV Canal):</label>
                        <input type="text" id="prog-desc-canal-2" placeholder="Ex: Câmera Onboard / Sinal Secundário">
                    </div>
                    <div class="form-group">
                        <label for="prog-logo-cat-2">Colocar logo categoria (URL):</label>
                        <input type="url" id="prog-logo-cat-2" placeholder="https://link-da-imagem.com">
                    </div>
                    <div class="form-group">
                        <label for="prog-logo-canal-2">Colocar logo canal (URL):</label>
                        <input type="url" id="prog-logo-canal-2" placeholder="https://link-da-imagem.com">
                    </div>
                    <div class="form-group">
                        <label for="prog-links-transmissao-2">Colocar links de transmissão:</label>
                        <input type="url" id="prog-links-transmissao-2" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="prog-links-replay-2">Colocar links de replay:</label>
                        <input type="url" id="prog-links-replay-2" placeholder="https://...">
                    </div>
                    <button type="submit" class="btn-submit btn-secondary">Salvar Programação Alternativa</button>
                </form>
            </section>
        </main>

        <!-- TABELA DE PROGRAMAÇÕES -->
        <section class="panel-lista">
            <h3>Programações Cadastradas</h3>
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data/Hora</th>
                            <th>Evento/Local</th>
                            <th>Tipo</th>
                            <th>Canal / Info</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-eventos-body">
                        <!-- Preenchido dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // Carrega a tabela assim que o navegador abre o arquivo
        window.onload = function() {
            atualizarTabela();
        };

        // SALVA SEM SOBRESCREVER OS DADOS ANTIGOS
        function salvarEvento(event, tipoFormulario) {
            event.preventDefault();

            const novoEvento = {
                id: 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                tipoCadastro: tipoFormulario === 1 ? 'Principal' : 'Alternativo',
                data: document.getElementById(`prog-data-${tipoFormulario}`).value,
                hora: document.getElementById(`prog-hora-${tipoFormulario}`).value,
                descricao: document.getElementById(`prog-descricao-${tipoFormulario}`).value,
                local: document.getElementById(`prog-local-${tipoFormulario}`).value,
                canal: document.getElementById(`prog-canal-${tipoFormulario}`).value,
                descricaoCanal: document.getElementById(`prog-desc-canal-${tipoFormulario}`).value || 'Canal Geral',
                logoCategoria: document.getElementById(`prog-logo-cat-${tipoFormulario}`).value || '',
                logoCanal: document.getElementById(`prog-logo-canal-${tipoFormulario}`).value || '',
                linkTransmissao: document.getElementById(`prog-links-transmissao-${tipoFormulario}`).value || '',
                linkReplay: document.getElementById(`prog-links-replay-${tipoFormulario}`).value || ''
            };

            // Busca os dados antigos de forma segura
            let listaProgramacao = [];
            try {
                const dadosArmazenados = localStorage.getItem('programacao_tv');
                if (dadosArmazenados) {
                    listaProgramacao = JSON.parse(dadosArmazenados);
                }
            } catch (e) {
                listaProgramacao = [];
            }

            // Junta o novo item com a lista existente
            listaProgramacao.push(novoEvento);

            // Grava de volta no LocalStorage
            localStorage.setItem('programacao_tv', JSON.stringify(listaProgramacao));

            // Reseta o formulário correto e recarrega a tabela visual
            document.getElementById(`cadastro-tv-form-${tipoFormulario}`).reset();
            atualizarTabela();
            alert('Programação salva com sucesso!');
        }

        // ATUALIZA A INTERFACE VISUAL DA TABELA
        function atualizarTabela() {
            const tbody = document.getElementById('tabela-eventos-body');
            if (!tbody) return;

            let listaProgramacao = [];
            try {
                const dadosArmazenados = localStorage.getItem('programacao_tv');
                if (dadosArmazenados) {
                    listaProgramacao = JSON.parse(dadosArmazenados);
                }
            } catch (e) {
                listaProgramacao = [];
            }

            if (listaProgramacao.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="sem-dados">Nenhuma programação cadastrada no momento.</td></tr>`;
                return;
            }

            // Organiza por ordem cronológica (Data e Hora)
            listaProgramacao.sort((a, b) => new Date(a.data + 'T' + a.hora) - new Date(b.data + 'T' + b.hora));

            tbody.innerHTML = '';
            listaProgramacao.forEach(evento => {
                const dataFormatada = evento.data.split('-').reverse().join('/');
                const badgeClass = evento.tipoCadastro === 'Principal' ? 'badge-principal' : 'badge-alternativo';
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${dataFormatada} - ${evento.hora}</td>
                    <td><strong>${evento.descricao}</strong><br><small>📍 ${evento.local}</small></td>
                    <td><span class="badge ${badgeClass}">${evento.tipoCadastro}</span></td>
                    <td>${evento.canal}<br><small>📺 ${evento.descricaoCanal}</small></td>
                    <td>
                        <button class="btn-deletar" onclick="excluirEvento('${evento.id}')">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // REMOVE EVENTOS MANUALMENTE POR ID
        function excluirEvento(id) {
            if (confirm("Tem certeza que deseja remover esta programação?")) {
                let listaProgramacao = JSON.parse(localStorage.getItem('programacao_tv')) || [];
                listaProgramacao = listaProgramacao.filter(evento => evento.id !== id);
                localStorage.setItem('programacao_tv', JSON.stringify(listaProgramacao));
                atualizarTabela();
            }
        }
    </script>
</body>
</html>
