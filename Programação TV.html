<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação TV & Streaming - Rally Nova Itália</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Topo da página */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 24px;
            font-weight: bold;
        }

        .logout-link {
            color: #cc0000;
            text-decoration: underline;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        /* Painel com borda tracejada */
        .panel-cadastro {
            border: 1px dashed #999;
            padding: 30px;
            background-color: #fafafa;
            margin-bottom: 30px;
        }

        .panel-cadastro h2 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* Alinhamento dos campos */
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-group label {
            width: 220px;
            font-weight: bold;
            font-size: 16px;
        }

        .form-group input, .form-group select {
            width: 350px;
            padding: 6px;
            font-size: 16px;
            border: 1px solid #999;
            background-color: #fff;
        }

        /* Botão Salvar */
        .btn-submit {
            background-color: #d4edd5;
            color: #000000;
            border: 1px solid #777;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            margin-left: 220px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #c3e6cb;
        }

        /* Seção da Grade de Programação */
        .grade-section {
            margin-top: 40px;
        }

        .grade-section h3 {
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        .img-logo {
            max-height: 30px;
            max-width: 60px;
            margin-right: 5px;
            object-fit: contain;
        }

        .links-transmissao a {
            color: #3b82f6;
            text-decoration: underline;
            margin-right: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- CABEÇALHO -->
        <header>
            <h1>Programação TV & Streaming - Rally Nova Itália</h1>
            <span class="logout-link" onclick="window.location.reload();">Sair do Painel</span>
        </header>

        <!-- PAINEL DE CADASTRO -->
        <main class="panel-cadastro">
            <h2>Painel de Cadastro (Modo Administrador)</h2>
            
            <form id="cadastro-tv-form" onsubmit="salvarEvento(event)">
                <div class="form-group">
                    <label for="prog-data">Data:</label>
                    <input type="date" id="prog-data" required>
                </div>

                <div class="form-group">
                    <label for="prog-hora">Hora:</label>
                    <input type="time" id="prog-hora" required>
                </div>

                <div class="form-group">
                    <label for="prog-descricao">Descrição categoria\evento:</label>
                    <input type="text" id="prog-descricao" placeholder="Ex: Rally Nova Itália - SS1 Shakedown" required>
                </div>

                <div class="form-group">
                    <label for="prog-local">Local:</label>
                    <input type="text" id="prog-local" required>
                </div>

                <div class="form-group">
                    <label for="prog-canal">Canal:</label>
                    <select id="prog-canal" required>
                        <option value="Bandsports">Bandsports</option>
                        <option value="Youtube">Youtube</option>
                        <option value="Globoplay Premium">Globoplay Premium</option>
                        <option value="Globo">Globo</option>
                        <option value="Fox Sports(USA)">Fox Sports(USA)</option>
                        <option value="Twitch .TV">Twitch .TV</option>
                        <option value="Roku.TV">Roku.TV</option>
                        <option value="Disney + (premium)">Disney + (premium)</option>
                        <option value="ESPN">ESPN</option>
                        <option value="Rally TV">Rally TV</option>
                        <option value="Sportv 2 (BR)">Sportv 2 (BR)</option>
                        <option value="Sportv 3 (BR)">Sportv 3 (BR)</option>
                        <option value="Sportv 4 Portugal">Sportv 4 Portugal</option>
                        <option value="Sportv 5 Portugal">Sportv 5 Portugal</option>
                        <option value="Racer BR">Racer BR</option>
                        <option value="Facebook">Facebook</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="prog-logo-cat">Colocar logo categoria (URL):</label>
                    <input type="url" id="prog-logo-cat" placeholder="https://link-da-imagem.com">
                </div>

                <div class="form-group">
                    <label for="prog-logo-canal">Colocar logo canal (URL):</label>
                    <input type="url" id="prog-logo-canal" placeholder="https://link-da-imagem.com">
                </div>

                <div class="form-group">
                    <label for="prog-links-transmissao">Colocar links de transmissão:</label>
                    <input type="url" id="prog-links-transmissao" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label for="prog-links-replay">Colocar links de replay:</label>
                    <input type="url" id="prog-links-replay" placeholder="https://...">
                </div>

                <button type="submit" class="btn-submit">Salvar Programação</button>
            </form>
        </main>

        <!-- SEÇÃO DA GRADE DE EXIBIÇÃO -->
        <section class="grade-section">
            <h3>Transmissões e Horários Cadastrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Data / Hora</th>
                        <th>Logos</th>
                        <th>Descrição Categoria / Evento / Local</th>
                        <th>Canal de Exibição</th>
                        <th>Links de Acesso</th>
                    </tr>
                </thead>
                <tbody id="grade-table-body">
                    <!-- Conteúdo inserido via JS -->
                </tbody>
            </table>
        </section>
    </div>

    <script>
        // Carrega os dados salvos no localStorage
        function obterEventos() {
            const dados = localStorage.getItem('rally_tv_streaming_dados');
            return dados ? JSON.parse(dados) : [];
        }

        // Armazena novos dados preservando os registros anteriores
        function salvarEvento(event) {
            event.preventDefault();

            const novoEvento = {
                id: Date.now(),
                data: document.getElementById('prog-data').value,
                hora: document.getElementById('prog-hora').value,
                descricao: document.getElementById('prog-descricao').value,
                local: document.getElementById('prog-local').value,
                canal: document.getElementById('prog-canal').value,
                logoCat: document.getElementById('prog-logo-cat').value || '',
                logoCanal: document.getElementById('prog-logo-canal').value || '',
                linkTransmissao: document.getElementById('prog-links-transmissao').value || '',
                linkReplay: document.getElementById('prog-links-replay').value || ''
            };

            const lista = obterEventos();
            lista.push(novoEvento);
            
            // Organiza por data e hora sequencialmente
            lista.sort((a, b) => new Date(`${a.data}T${a.hora}`) - new Date(`${b.data}T${b.hora}`));
            
            localStorage.setItem('rally_tv_streaming_dados', JSON.stringify(lista));

            document.getElementById('cadastro-tv-form').reset();
            carregarGrade();
        }

        function formatarData(dataString) {
            const partes = dataString.split('-');
            if (partes.length !== 3) return dataString;
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        // Reconstrói a tabela dinamicamente em tela
        function carregarGrade() {
            const lista = obterEventos();
            const tbody = document.getElementById('grade-table-body');
            tbody.innerHTML = '';

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#666; padding: 20px;">Nenhuma transmissão agendada.</td></tr>`;
                return;
            }

            lista.forEach(item => {
                const tr = document.createElement('tr');
                
                let linksHtml = '';
                if (item.linkTransmissao) linksHtml += `<a href="${item.linkTransmissao}" target="_blank">🔴 Ao Vivo</a> `;
                if (item.linkReplay) linksHtml += `<a href="${item.linkReplay}" target="_blank">🔄 Replay</a>`;
                if (!item.linkTransmissao && !item.linkReplay) linksHtml = `<span style="color:#666;">Sem links</span>`;

                let logosHtml = '';
                if (item.logoCat) logosHtml += `<img src="${item.logoCat}" class="img-logo" alt="Logo Categoria">`;
                if (item.logoCanal) logosHtml += `<img src="${item.logoCanal}" class="img-logo" alt="Logo Canal">`;

                tr.innerHTML = `
                    <td>${formatarData(item.data)} - ${item.hora}</td>
                    <td>${logosHtml || '-'}</td>
                    <td><strong>${item.descricao}</strong><br>📍 ${item.local}</td>
                    <td>${item.canal}</td>
                    <td class="links-transmissao">${linksHtml}</td>
                `;

                tbody.appendChild(tr);
            });
        }

        window.onload = carregarGrade;
    </script>
</body>
</html>
