<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar de Líderes</title>
    <style>
        body {
            margin: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 900px;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
        }

        /* Seção do Título (Esquerda) */
        .secao-titulo {
            flex: 1;
            text-align: center;
        }

        .titulo {
            font-family: 'Arial Black', Impact, sans-serif;
            color: #000000;
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 8px 0;
            letter-spacing: 0.5px;
        }

        .subtitulo {
            color: #333333;
            font-size: 1rem;
            font-style: italic;
            margin: 0;
        }

        /* Seção do Placar e Créditos (Direita) */
        .secao-dados {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .placar {
            color: #000000;
        }

        .placar-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .placar-sub {
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .lista-posicoes {
            list-style: none;
            padding: 0;
            margin: 0;
            font-weight: bold;
            font-size: 1rem;
            line-height: 1.6;
        }

        .creditos {
            color: #000000;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Lado Esquerdo -->
        <div class="secao-titulo">
            <h1 class="titulo">VITÓRIA DE RAKALA</h1>
            <p class="subtitulo">Mitsubishi Mirage — Rally X Euro Fin</p>
        </div>

        <!-- Lado Direito -->
        <div class="secao-dados">
            <div class="placar">
                <div class="placar-header">Top 3-Open 4WD</div>
                <div class="placar-sub">m</div>
                <ul class="lista-posicoes">
                    <li>1. Rakala(FIN)-Mitsubishi Mirage</li>
                    <li>2. Daarbark(DEN)-FC2</li>
                    <li>3. Romet(EST)-FC2</li>
                </ul>
            </div>
            
            <div class="creditos">
                © 2026 — Rallycross-Motorsportverso
            </div>
        </div>
    </div>

</body>
</html>
