<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitória Rakala - Mitsubishi Mirage | Rally X Euro Fin</title>
    <style>
        :root {
            --primary-color: #e60000; /* Vermelho Mitsubishi */
            --dark-color: #1a1a1a;
            --light-color: #f4f4f4;
            --text-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: var(--light-color);
            color: var(--text-color);
        }

        header {
            background-color: var(--dark-color);
            color: #fff;
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 5px solid var(--primary-color);
        }

        header h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #ccc;
            font-size: 1.2rem;
            font-style: italic;
        }

        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .highlight-box {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 5px solid var(--primary-color);
            margin-bottom: 2rem;
        }

        h2 {
            color: var(--dark-color);
            margin-bottom: 1rem;
        }

        ul {
            list-style-position: inside;
            margin-bottom: 1.5rem;
        }

        li {
            margin-bottom: 0.5rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: var(--dark-color);
            color: #fff;
            font-size: 0.9rem;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vitória de Rakala</h1>
        <p>Mitsubishi Mirage — Rally X Euro Fin</p>
    </header>
         <p>Top 3-Open 4WD</p>
    m    <p>1.Rakala(FIN)-Mitsubishi Mirage</p>
         <P>2.Daarbark(DEN)-FC2</p>
         <p>3.Romet(EST)-FC2</p>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 — Rallycross-Motorsportverso</p>
    </footer>

</body>
</html>
