<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally One estreia mundialmente no próximo fim de semana no rally de SPA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a; /* Fundo grafite escuro */
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: #242424;
            border-radius: 8px;
            border: 1px solid #333333;
            overflow: hidden;
            padding: 24px;
        }

        h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 20px;
            border-bottom: 2px solid #ff6600;
            padding-bottom: 8px;
        }

        h2 {
            font-size: 20px;
            color: #ffaa66;
            margin-top: 24px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h3 {
            font-size: 16px;
            color: #ffffff;
            margin-top: 16px;
            margin-bottom: 6px;
        }

        p {
            font-size: 15px;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 14px;
        }

        /* Ajuste do tamanho e proporção da imagem */
        img {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #333333;
            margin: 10px 0 14px 0;
            display: block;
        }

        /* Estilização da Tabela de Inscritos */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            background-color: #1f1f1f;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #333333;
        }

        th {
            background-color: #ff6600;
            color: #ffffff;
            text-align: left;
            padding: 10px 12px;
            font-size: 14px;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #333333;
            color: #dddddd;
            font-size: 14px;
        }

        tr:nth-child(even) {
            background-color: #2a2a2a;
        }

        tr:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rally One estreia mundialmente no próximo fim de semana no rally de SPA</h1>
        <p>
            O novo construtor do WRC Belga com protótipo Rally 1 próprio faz sua estreia no Rally de SPA com o Leo Rossel que correu no WRC 2 com carros da Citroën e Lancia na temporada de 2026.
          <a h ref ="https://pt.autohebdo.fr/not%C3%ADcia/rali/O-Projeto-Rally-One-participar%C3%A1-do-Rali-de-Spa-na-pr%C3%B3xima-semana..html" a> 
        </p>
    </div>
</body>
</html>
