<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #fdf6e3; /* Fundo levemente amarelado para contraste */
        }

        /* Barra de Navegação Estilo GitHub */
        .github-menu {
            background-color: #3e2723; /* Marrom Escuro (Fundo do menu) */
            padding: 16px 32px;
            display: flex;
            align-items: center;
            color: #ffca28; /* Amarelo (Texto e ícones) */
            border-bottom: 1px solid #ffb300;
        }

        .menu-item {
            margin-right: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.3s;
            text-decoration: none;
            color: inherit;
        }

        .menu-item:hover {
            background-color: #5d4037; /* Marrom mais claro no hover */
            color: #ffe082;
        }

        .active {
            border-bottom: 2px solid #ffca28; /* Linha amarela indicando aba ativa */
        }

        .search-bar {
            background-color: #5d4037;
            border: 1px solid #ffca28;
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            margin-left: auto;
        }
    </style>
</head>
<body>

<nav class="github-menu">
    <a href="#" class="menu-item active">Barretos</a>Inscritos 
    <a href="#" class="menu-item">Categorias</a>
 
    
    <input type="text" class="search-bar" placeholder="Pesquisar...">
</nav>

</body>
</html>
