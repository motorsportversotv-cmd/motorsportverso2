<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        /* Estilo da barra do menu */
        .github-menu {
            background-color: #3e2723; /* Marrom Escuro */
            padding: 10px 20px;
            display: flex;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            border-bottom: 1px solid #ffca28;
        }

        /* Link principal */
        .menu-item {
            color: #ffca28; /* Amarelo */
            text-decoration: none;
            padding: 8px 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px; /* Espaço entre Barretos e Inscritos */
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }

        /* O contador "Inscritos" (Badge) dentro do link */
        .counter {
            background-color: #5d4037; /* Marrom médio */
            color: #ffe082; /* Amarelo claro */
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #ffb300;
        }

        /* Estado ativo (selecionado) */
        .menu-item.active {
            border-bottom: 2px solid #ffca28;
            background-color: rgba(255, 202, 40, 0.1);
        }

        .menu-item:hover {
            background-color: #5d4037;
        }
    </style>
</head>
<body>

<nav class="github-menu">
    <!-- O link completo agora engloba o nome e o contador -->
    <a href="#" class="menu-item active" onclick="ativar(this)">
        Barretos <span class="counter">Inscritos 1.2k</span>
    </a>
    
    <a href="#" class="menu-item" onclick="ativar(this)">
        Categorias
    </a>
</nav>

<script>
    function ativar(elemento) {
        // Remove a marcação de ativo de todos e adiciona no clicado
        document.querySelectorAll('.menu-item').forEach(item => {
            item.classList.remove('active');
        });
        elemento.classList.add('active');
    }
</script>

</body>
</html>
