<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        /* Estilo da barra */
        .github-menu {
            background-color: #3e2723; /* Marrom Escuro */
            padding: 10px;
            display: flex;
            gap: 10px;
            font-family: sans-serif;
            border-bottom: 2px solid #ffca28;
        }

        .menu-item {
            color: #ffca28; /* Amarelo */
            text-decoration: none;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 6px 6px 0 0;
            font-weight: bold;
        }

        .counter {
            background-color: #5d4037;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid #ffca28;
        }

        /* Estilo quando clicado */
        .menu-item.active {
            background-color: #ffca28;
            color: #3e2723;
        }
        .active .counter {
            background-color: #3e2723;
            color: #ffca28;
        }

        /* Área de conteúdo */
        .content {
            padding: 20px;
            background: #fff8e1;
            display: none; /* Esconde por padrão */
            border: 1px solid #ffca28;
        }
        .content.show {
            display: block; /* Mostra o selecionado */
        }
    </style>
</head>
<body>

<nav class="github-menu">
    <a href="javascript:void(0)" class="menu-item active" onclick="trocarAba(this, 'aba-barretos')">
        Barretos <span class="counter">Inscritos 1.2k</span>
    </a>
    
    <a href="javascript:void(0)" class="menu-item" onclick="trocarAba(this, 'aba-categorias')">
        Categorias
    </a>
</nav>

<!-- Seções de conteúdo -->
<div id="aba-barretos" class="content show">
    <h2>Página de Barretos</h2>
    <p>Aqui aparece a lista de inscritos de Barretos...</p>
</div>

<div id="aba-categorias" class="content">
    <h2>Categorias</h2>
    <p>Veja as categorias disponíveis aqui.</p>
</div>

<script>
    function trocarAba(elemento, idConteudo) {
        // 1. Remove o "active" de todos os botões
        document.querySelectorAll('.menu-item').forEach(aba => aba.classList.remove('active'));
        
        // 2. Esconde todos os conteúdos
        document.querySelectorAll('.content').forEach(cont => cont.classList.remove('show'));

        // 3. Ativa o botão clicado e mostra o conteúdo dele
        elemento.classList.add('active');
        document.getElementById(idConteudo).classList.add('show');
    }
</script>

</body>
</html>
