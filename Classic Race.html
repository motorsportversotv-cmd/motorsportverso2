<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Classic Race - Motorsportverso</title>
    <style>
        /* Estilo Geral Retrô */
        body {
            background-color: #f4ecd8; /* Fundo creme envelhecido */
            color: #2c2c2c;
            font-family: 'Courier New', Courier, monospace; /* Fonte tipo máquina de escrever */
            margin: 0;
            padding: 50px;
            line-height: 1.6;
        }

        /* Container principal para criar um efeito de papel */
        .container {
            max-width: 800px;
            margin: auto;
            border: 2px solid #3d5a45; /* Verde corrida britânico */
            padding: 40px;
            background-color: #fdfaf0;
            box-shadow: 10px 10px 0px #d14933; /* Sombra sólida vermelha */
        }

        h1 {
            color: #d14933; /* Vermelho vintage */
            text-transform: uppercase;
            text-align: center;
            border-bottom: 4px double #3d5a45;
            padding-bottom: 10px;
            letter-spacing: 3px;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav > ul > li {
            background: #3d5a45; /* Fundo verde para os títulos principais */
            color: #f4ecd8;
            padding: 10px;
            margin-top: 15px;
            font-size: 1.2em;
        }

        nav ul ul li {
            background: transparent;
            color: #2c2c2c;
            padding-left: 20px;
            border-left: 3px solid #d14933;
            margin: 5px 0;
        }

        hr {
            border: 0;
            border-top: 2px dashed #3d5a45;
            margin: 30px 0;
        }

        p {
            text-align: center;
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Classic Race</h1>

        <nav>
            <ul>
                <!-- Primeira Aba com subitens -->
                <li>
                    <strong>Goodwood:</strong>
                </li>
                <ul>
                    <li>Revival</li>
                    <li>Members' Meeting</li>
                </ul>
                
                <!-- Segunda Aba -->
                <li>
                    <strong>Le Mans Classic Series</strong>
                </li>
            </ul>
        </nav>

        <!-- Adicione este bloco nos eu <body>, logo do <h1>--> 
        <div class="news-ticker"> 
            <div class="ticker-content">
                 ULTIMAS NOTÍCIAS: Ferrari vence em Goodwood! • 83MM Members meeting no proximo final de semana• 🏁
    </div>
</div>

        <hr>
        <p>Bem-vindo ao Motorsportverso!</p>
    </div>

</body>
</html>
