<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GT Racing-Motorsportverso</title>
    <style>
        /* Estilo do Menu */
        nav {
            background-color: black; /* Fundo Preto */
            padding: 10px;
        }

        ul {
            list-style: none; /* Remove as bolinhas da lista */
            display: flex;    /* Coloca os itens lado a lado */
            margin: 0;
            padding: 0;
        }

        li {
            /* Linha cinza entre os itens (borda direita) */
            border-right: 2px solid gray; 
        }

        li:last-child {
            border-right: none; /* Remove a linha do último item */
        }

        a {
            display: block;
            padding: 15px 25px;
            color: white;           /* Texto Branco */
            text-decoration: none;  /* Remove o sublinhado */
            font-family: Arial, sans-serif;
            font-weight: bold;
            transition: 0.3s;       /* Efeito suave ao passar o mouse */
        }

        /* Efeito de passar o mouse: Fundo Vermelho */
        a:hover {
            background-color: red; 
        }
    </style>
</head>
<body>

    <nav>
        <ul>
        <div class="news-cards-container">
    
    <!-- Card 1 -->
    <div class="news-card">
        <div class="card-category">GT World Challenge</div>
        <div class="card-title">Ferrari domina os treinos em Monza com tempo recorde.</div>
        <div class="card-date">06/04/2026</div>
    </div>

    <!-- Card 2 -->
    <div class="news-card">
        <div class="card-category">GT Series BR</div>
        <div class="card-title">Inscrições abertas para a 3ª Etapa: Interlagos.</div>
        <div class="card-date">05/04/2026</div>
    </div>

    <!-- Card 3 -->
    <div class="news-card">
        <div class="card-category">IGTC</div>
        <div class="card-title">Nova atualização do regulamento técnico para 2026.</div>
        <div class="card-date">04/04/2026</div>
    </div>

</div>

    </div>
</div>
</body>
</html>
