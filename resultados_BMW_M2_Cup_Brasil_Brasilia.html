<HTML>
       <HEAD>
             <meta charset="UTF-8">
             <meta name="viewport">
              <title>  
                Resultados BMW M2 Cup Brasil em Brasilia vitórias de Tavares e Valente          
              </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a; /* Fundo grafite escuro */
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px; /* Largura ideal para leitura de notícias */
            background-color: #242424;
            border-radius: 8px;
            border: 1px solid #333333;
            overflow: hidden;
            padding: 24px;
        }

        .news-meta {
            font-size: 13px;
            color: #ffaa66;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* IMAGEM AJUSTADA: Reduzida para 120px de altura conforme solicitado, sem distorcer */
        .news-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #333333;
        }

        .news-title {
            font-size: 24px;
            font-weight: bold;
            line-height: 1.3;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .news-content {
            font-size: 15px;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .news-content p {
            margin-bottom: 14px;
        }

        /* Botão estilizado em Laranja Rally */
        .btn-access {
            display: inline-block;
            background-color: #ff6600;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-access:hover {
            background-color: #e65c00;
        }

        .btn-access:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
      <div class="container">
         <div class="news-content">
            
            <h1>
               Resultados BMW M2 Cup Brasil em Brasilia 
            </h1>
            <p>
                 Resultados BMW M2 Cup Brasil em Brasilia vitórias de Tavares e Valente</p>
        </div>
</body>
</HTML>
